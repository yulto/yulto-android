<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#2563eb">
<title>YULTO CARE</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🩹%3C/text%3E%3C/svg%3E">
<style>
:root{--brand:#2563eb;--brand-2:#1d4ed8;--bg:#f1f5f9;--card:#fff;--text:#0f172a;--muted:#64748b;--line:#e2e8f0;--ok:#10b981;--warn:#f59e0b;--danger:#dc2626;--radius:14px;--shadow:0 1px 3px rgba(0,0,0,.08)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.5;overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
input,textarea,select{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:10px;background:#fff;outline:none;font-size:16px}
input:focus,textarea:focus,select:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(37,99,235,.12)}
textarea{resize:vertical;min-height:70px}.hidden{display:none!important}
#app{display:flex;flex-direction:column;min-height:100dvh;max-width:720px;margin:0 auto;background:var(--bg)}
header{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;display:flex;align-items:center;justify-content:space-between}
.logo{font-weight:800;font-size:18px;color:var(--brand);letter-spacing:-.3px}.logo span{color:var(--text)}
main{flex:1;padding:16px;padding-bottom:calc(90px + env(safe-area-inset-bottom))}
nav{position:fixed;bottom:0;left:0;right:0;z-index:30;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 0 calc(6px + env(safe-area-inset-bottom));max-width:720px;margin:0 auto}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:11px;font-weight:600;color:var(--muted);transition:.15s}
nav button.active{color:var(--brand)}nav button svg{width:22px;height:22px}
.card{background:var(--card);border-radius:var(--radius);padding:14px;margin-bottom:10px;box-shadow:var(--shadow);border:1px solid var(--line)}
.card.link{transition:.15s;cursor:pointer}.card.link:active{transform:scale(.99);border-color:var(--brand)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:12px 18px;background:var(--brand);color:#fff;border-radius:10px;font-weight:600;font-size:15px;transition:.15s;width:100%}
.btn:active{transform:scale(.98);background:var(--brand-2)}.btn.sec{background:#fff;color:var(--text);border:1px solid var(--line)}
.btn.danger{background:var(--danger)}.btn.ok{background:var(--ok)}.btn.warn{background:var(--warn)}
.btn.sm{padding:8px 12px;font-size:13px;width:auto}
.row{display:flex;gap:8px;align-items:center}.row.between{justify-content:space-between}.row.wrap{flex-wrap:wrap}
.muted{color:var(--muted);font-size:13px}.title{font-size:20px;font-weight:700;margin:0 0 4px}.sub{font-size:13px;color:var(--muted);margin:0 0 14px}
.label{display:block;font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin:12px 0 4px}
.empty{text-align:center;padding:40px 20px;color:var(--muted)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{background:#f8fafc;padding:10px;border-radius:10px}.stat .l{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.3px}.stat .v{font-size:17px;font-weight:700;margin-top:2px}
.tbar{display:flex;height:14px;border-radius:999px;overflow:hidden;margin-top:6px;background:#f1f5f9}
.tlegend{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px;font-size:11px;color:var(--muted)}
.tlegend span{display:flex;align-items:center;gap:4px}.tdot{width:8px;height:8px;border-radius:50%}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}.grid3 img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;background:#f1f5f9}
.modal{position:fixed;inset:0;z-index:50;background:rgba(15,23,42,.5);display:flex;align-items:flex-end;justify-content:center}
@media(min-width:600px){.modal{align-items:center;padding:20px}}
.modal .sheet{background:#fff;border-radius:20px 20px 0 0;width:100%;max-width:520px;max-height:92vh;overflow-y:auto;padding:20px 20px calc(20px + env(safe-area-inset-bottom));position:relative}
@media(min-width:600px){.modal .sheet{border-radius:20px;padding-bottom:20px}}
.sheet h2{margin:0 0 4px;font-size:19px}.sheet .close{position:absolute;top:14px;right:14px;padding:6px;color:var(--muted)}
#chart,#growthChart,#pieChart{width:100%;height:180px;background:#f8fafc;border-radius:10px}
@keyframes spin{to{transform:rotate(360deg)}}.analyzing{padding:20px;text-align:center;color:var(--muted)}
.analyzing .spinner{width:44px;height:44px;border:4px solid var(--line);border-top-color:var(--brand);border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 12px}
#toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#0f172a;color:#fff;padding:10px 18px;border-radius:999px;font-size:13px;font-weight:500;z-index:200;opacity:0;transition:.3s;pointer-events:none;white-space:nowrap;max-width:90vw;overflow:hidden;text-overflow:ellipsis}
#toast.show{opacity:1;transform:translateX(-50%) translateY(-8px)}
#login{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px;background:linear-gradient(135deg,#eff6ff,#dbeafe)}
#login .box{background:#fff;border-radius:22px;padding:32px 24px;width:100%;max-width:380px;box-shadow:0 12px 40px rgba(37,99,235,.15)}
#login h1{font-size:26px;margin:0 0 6px;color:var(--brand);text-align:center}#login h1 span{color:var(--text)}
#login p{text-align:center;color:var(--muted);margin:0 0 22px;font-size:14px}
.badge{display:inline-block;padding:3px 8px;border-radius:999px;font-size:11px;font-weight:600;background:#f1f5f9;color:var(--muted)}
.badge.active{background:#dbeafe;color:var(--brand-2)}.badge.healed{background:#dcfce7;color:#059669}
.badge.infected{background:#fee2e2;color:#dc2626}.badge.stalled{background:#fef3c7;color:#d97706}
.badge.improving{background:#dcfce7;color:#059669}.badge.deteriorating{background:#fee2e2;color:#dc2626}
.badge.low{background:#dcfce7;color:#059669}.badge.medium{background:#fef3c7;color:#d97706}.badge.high{background:#fee2e2;color:#dc2626}
.progress{height:6px;background:#e2e8f0;border-radius:999px;overflow:hidden;margin-top:8px}.progress > div{height:100%;background:var(--brand);transition:.3s}
.safety-bar{padding:12px;border-radius:10px;font-size:13px;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;gap:10px;border:1px solid}
.safety-bar.ok{background:#f0fdf4;border-color:#86efac;color:#166534}
.safety-bar.warn{background:#fef3c7;border-color:#fde68a;color:#92400e}
.safety-bar.err{background:#fee2e2;border-color:#fca5a5;color:#991b1b}
.safety-bar .t{font-weight:600}.safety-bar .d{font-size:11px;opacity:.85;margin-top:2px}
.safety-bar button{background:#fff;border:1px solid currentColor;color:inherit;padding:6px 10px;border-radius:8px;font-size:12px;font-weight:600;white-space:nowrap}
.heal-badge{display:flex;align-items:center;gap:10px;background:linear-gradient(135deg,#eff6ff,#dbeafe);padding:14px;border-radius:12px;border:1px solid #bfdbfe}
.heal-badge .big{font-size:32px;font-weight:800;color:var(--brand-2);line-height:1}
.heal-badge .unit{font-size:14px;color:var(--brand-2);font-weight:600}
.heal-badge .rng{font-size:12px;color:var(--muted);margin-top:2px}
.alert-flag{padding:10px 12px;border-radius:10px;font-size:13px;font-weight:600;margin-bottom:10px;text-align:center}
.alert-flag.improving{background:#dcfce7;color:#166534;border:1px solid #86efac}
.alert-flag.stalled{background:#fef3c7;color:#92400e;border:1px solid #fde68a}
.alert-flag.deteriorating{background:#fee2e2;color:#991b1b;border:1px solid #fca5a5}
.alert-flag.new{background:#dbeafe;color:#1e40af;border:1px solid #93c5fd}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.chip{padding:5px 10px;border-radius:999px;background:#f1f5f9;font-size:12px;font-weight:600;border:1px solid var(--line)}
.chip.on{background:#dbeafe;color:var(--brand-2);border-color:#bfdbfe}
.pie-legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px;font-size:12px}
.compare-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.compare-grid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px}
.compare-label{text-align:center;font-size:11px;color:var(--muted);margin-top:4px}
.slider-row{display:flex;align-items:center;gap:10px;margin-top:6px}
.slider-row input[type=range]{flex:1}
.timeline{position:relative;padding-left:22px}
.timeline::before{content:'';position:absolute;left:6px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tl-item{position:relative;padding:8px 0}
.tl-item::before{content:'';position:absolute;left:-19px;top:14px;width:12px;height:12px;border-radius:50%;background:var(--brand);border:2px solid #fff;box-shadow:0 0 0 2px var(--brand)}
.tl-date{font-size:11px;color:var(--muted);font-weight:600}
.tl-body{font-size:13px;margin-top:2px}
.progress-ring{position:relative;width:120px;height:120px;margin:0 auto}
.progress-ring svg{transform:rotate(-90deg)}
.progress-ring .pct{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.progress-ring .pct .n{font-size:26px;font-weight:800;color:var(--brand-2);line-height:1}
.progress-ring .pct .l{font-size:10px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin-top:2px}
.speak-btn{position:absolute;right:10px;top:10px;width:34px;height:34px;border-radius:50%;background:#eff6ff;border:1px solid #bfdbfe;color:var(--brand-2);display:flex;align-items:center;justify-content:center}
.speak-btn:active{background:#dbeafe}
.zone-bar{display:flex;height:20px;border-radius:6px;overflow:hidden;margin-top:6px;background:#f1f5f9}
.zone-label{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:4px}
.heatmap-tabs{display:flex;gap:6px;margin-bottom:10px}
.heatmap-tabs button{flex:1;padding:8px;border-radius:8px;background:#f1f5f9;font-size:12px;font-weight:600;border:1px solid var(--line)}
.heatmap-tabs button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
@media print{nav,header,.btn,.safety-bar,.speak-btn{display:none!important}}
</style>
</head>
<body>

<div id="login">
  <div class="box">
    <h1>YULTO<span>CARE</span></h1>
    <p>Clinician access</p>
    <label class="label">PIN</label>
    <input id="pin" type="password" inputmode="numeric" placeholder="Enter your PIN" autocomplete="off">
    <div style="height:16px"></div>
    <button class="btn" onclick="doLogin()">Unlock</button>
    <div style="height:12px"></div>
    <p class="muted" style="text-align:center;font-size:12px">First time? PIN is <b>0000</b>. Change in Settings.</p>
    <div id="ai-status" style="text-align:center;font-size:11px;color:var(--muted);margin-top:12px">Loading…</div>
  </div>
</div>

<div id="app" class="hidden">
  <header>
    <div class="logo">YULTO<span>CARE</span></div>
    <button onclick="go('settings')" style="padding:6px;color:var(--muted)">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h0a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h0a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v0a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
  </header>
  <main id="view"></main>
  <nav id="nav">
    <button data-tab="home" onclick="go('home')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg><span>Home</span></button>
    <button data-tab="patients" onclick="go('patients')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="23" y1="11" x2="17" y2="11"/></svg><span>Patients</span></button>
    <button data-tab="stats" onclick="go('stats')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg><span>Stats</span></button>
    <button data-tab="settings" onclick="go('settings')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/></svg><span>Settings</span></button>
  </nav>
</div>

<div id="modal" class="modal hidden"><div class="sheet" id="modalSheet"></div></div>
<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.20.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"></script>
<script src="capacitor.js" type="module"></script>

<script>
/* ═══════════════════════════════════════════════════════════════════
   YULTO CARE v6.0 — full clinical platform
   Voice · Advanced tissue analysis · Visualization · Full workflow
   ═══════════════════════════════════════════════════════════════════ */

const BACKUP_INTERVAL_MS = 3*24*60*60*1000;
let state = {
  screen:'home', currentPatient:null, currentWound:null,
  woundModel:null, aiReady:false, lastBackupAt:0, native:false,
  failedAttempts:0,
};
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const $ = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>[...r.querySelectorAll(s)];
const esc = s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtDate = d=>new Date(d).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'});
const fmtShort = d=>new Date(d).toLocaleDateString(undefined,{month:'short',day:'numeric'});
const fmtDateTime = d=>new Date(d).toLocaleString(undefined,{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});
function toast(msg,dur=2200){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),dur)}
function withTimeout(p,ms,label){return Promise.race([p,new Promise((_,rej)=>setTimeout(()=>rej(new Error((label||'op')+' timed out')),ms))])}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function blobToBase64(b){return new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(b)})}
function base64ToBlob(d){const [m,b]=d.split(',');return new Blob([Uint8Array.from(atob(b),c=>c.charCodeAt(0))],{type:m.match(/:(.*?);/)[1]})}

/* ─── Data layer ─── */
let _browserDb = null;
async function openBrowserDB(){
  return new Promise((res,rej)=>{
    const r = indexedDB.open('yultocare', 3);
    r.onupgradeneeded = e => {
      const d = e.target.result;
      if(!d.objectStoreNames.contains('patients')) d.createObjectStore('patients',{keyPath:'id'});
      if(!d.objectStoreNames.contains('wounds')){const s=d.createObjectStore('wounds',{keyPath:'id'});s.createIndex('patientId','patientId')}
      if(!d.objectStoreNames.contains('images')){const s=d.createObjectStore('images',{keyPath:'id'});s.createIndex('woundId','woundId')}
      if(!d.objectStoreNames.contains('assessments')){const s=d.createObjectStore('assessments',{keyPath:'id'});s.createIndex('woundId','woundId')}
      if(!d.objectStoreNames.contains('settings')) d.createObjectStore('settings',{keyPath:'k'});
      if(!d.objectStoreNames.contains('audit')) d.createObjectStore('audit',{keyPath:'id'});
      if(!d.objectStoreNames.contains('backups')) d.createObjectStore('backups',{keyPath:'id'});
    };
    r.onsuccess = () => { _browserDb = r.result; res(); };
    r.onerror = () => rej(r.error);
  });
}
function btx(store,mode='readonly'){return _browserDb.transaction(store,mode).objectStore(store)}
const DB = {
  async put(s,v){ if(state.native) return window.yultoDB.put(s,v);
    return new Promise((res,rej)=>{const r=btx(s,'readwrite').put(v);r.onsuccess=()=>res(v);r.onerror=()=>rej(r.error)}); },
  async get(s,k){ if(state.native) return window.yultoDB.get(s,k);
    return new Promise((res,rej)=>{const r=btx(s).get(k);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}); },
  async all(s,i,k){ if(state.native) return window.yultoDB.all(s,i,k);
    return new Promise((res,rej)=>{const st=btx(s);const r=k?st.index(i).getAll(k):st.getAll();r.onsuccess=()=>res(r.result||[]);r.onerror=()=>rej(r.error)}); },
  async del(s,k){ if(state.native) return window.yultoDB.del(s,k);
    return new Promise((res,rej)=>{const r=btx(s,'readwrite').delete(k);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)}); },
  async clearAll(){ if(state.native) return window.yultoDB.clearAll();
    for(const s of ['patients','wounds','images','assessments','audit','backups']){
      await new Promise(r=>{const t=_browserDb.transaction(s,'readwrite');t.objectStore(s).clear();t.oncomplete=r});
    } }
};
async function logAudit(a,d){ try{ await DB.put('audit',{id:uid(),action:a,details:d||{},ts:Date.now()}); }catch(e){} }

/* ─── Backup ─── */
async function runBackup(reason){
  try{
    if(state.native){
      await window.yultoDB.shareBackup(reason||'manual');
      const s = await DB.get('settings','last_backup_ts');
      state.lastBackupAt = s?.v || Date.now();
      toast('Backup ready — pick where to save',3000);
    } else {
      const payload = {
        app:'YULTO CARE', version:'6.0-web', exportedAt:new Date().toISOString(),
        patients: await DB.all('patients'), wounds: await DB.all('wounds'),
        assessments: await DB.all('assessments'),
        images: await Promise.all((await DB.all('images')).map(async i=>({...i, blob:await blobToBase64(i.blob)}))),
        audit: await DB.all('audit'),
      };
      const blob = new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
      a.download = 'yulto-backup-'+new Date().toISOString().slice(0,10)+'.json';
      document.body.appendChild(a); a.click();
      setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},2000);
      await DB.put('settings',{k:'last_backup_ts',v:Date.now()});
      state.lastBackupAt = Date.now();
      toast('Backup downloaded');
    }
  }catch(e){ toast('Backup failed: '+e.message,3500); }
}
async function maybeAutoBackup(){
  const rec = await DB.get('settings','last_backup_ts');
  const last = rec?.v || 0;
  state.lastBackupAt = last;
  const n = (await DB.all('patients')).length;
  if(n === 0) return;
  if(Date.now() - last >= BACKUP_INTERVAL_MS) setTimeout(()=>runBackup('auto-3day'),1500);
}
function backupStatus(){
  const last = state.lastBackupAt || 0;
  if(!last) return {cls:'err', title:'No backup yet', detail:'Tap to back up now.'};
  const age = Date.now() - last;
  const days = Math.floor(age/(24*60*60*1000));
  if(age < BACKUP_INTERVAL_MS) return {cls:'ok', title:'Backed up '+timeAgo(last), detail:'Next auto-backup in '+Math.max(1,3-days)+' day(s).'};
  if(age < BACKUP_INTERVAL_MS*2) return {cls:'warn', title:'Backup overdue ('+timeAgo(last)+')', detail:'Tap to back up now.'};
  return {cls:'err', title:'Backup very overdue', detail:days+' days since last backup.'};
}
function timeAgo(ts){
  const s = Math.floor((Date.now()-ts)/1000);
  if(s<60) return 'just now';
  const m = Math.floor(s/60); if(m<60) return m+'m ago';
  const h = Math.floor(m/60); if(h<24) return h+'h ago';
  return Math.floor(h/24)+'d ago';
}

const hasTTS = 'speechSynthesis' in window;
const hasSR  = 'SpeechRecognition' in window || 'webkitSpeechRecognition' in window;
let _recognition = null;
let _currentUtterance = null;

function pickVoice(){
  const voices = speechSynthesis.getVoices();
  return voices.find(v => /en-GB|en-US/.test(v.lang) && /Google|Samantha|Daniel/.test(v.name))
      || voices.find(v => v.lang.startsWith('en'))
      || voices[0];
}
if(hasTTS) speechSynthesis.getVoices();

function speak(text, opts){
  if(!hasTTS){ toast('Read-aloud not available'); return; }
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.voice = pickVoice();
    u.rate = opts?.rate ?? 0.95;
    u.pitch = 1; u.volume = 1;
    u.onend = () => { _currentUtterance = null; };
    u.onerror = () => { _currentUtterance = null; };
    _currentUtterance = u;
    speechSynthesis.speak(u);
  }catch(e){ toast('Voice error: '+e.message); }
}
function stopSpeaking(){ if(hasTTS) speechSynthesis.cancel(); _currentUtterance = null; }

async function readAssessmentAloud(assessment, patient, wound, forecast){
  if(!assessment){ toast('No assessment to read'); return; }
  const lines = [];
  lines.push('Wound assessment report.');
  lines.push(`Patient ${patient?.name || 'unknown'}.`);
  if(wound) lines.push(`Wound: ${wound.label}, ${(wound.type||'').replace(/_/g,' ')}, at ${wound.location || 'unspecified location'}.`);
  lines.push(`Assessment date: ${new Date(assessment.createdAt).toLocaleDateString()}.`);
  if(assessment.areaCm2) lines.push(`Area: ${assessment.areaCm2} square centimeters.`);
  if(assessment.perimeterCm) lines.push(`Perimeter: ${assessment.perimeterCm} centimeters.`);
  if(assessment.circularity) lines.push(`Circularity: ${(assessment.circularity*100).toFixed(0)} percent.`);
  if(assessment.infection != null) lines.push(`Infection risk: ${(assessment.infection*100).toFixed(0)} percent.`);
  if(assessment.healingIndex != null) lines.push(`Healing index: ${(assessment.healingIndex*100).toFixed(0)} percent.`);
  if(assessment.tissue){
    const parts = Object.entries(assessment.tissue).filter(([k,v])=>v>0).map(([k,v])=>`${v} percent ${k}`);
    if(parts.length) lines.push(`Tissue composition: ${parts.join(', ')}.`);
  }
  if(assessment.pain != null) lines.push(`Pain score: ${assessment.pain} out of 10.`);
  if(assessment.exudate) lines.push(`Exudate: ${assessment.exudate}.`);
  if(assessment.odor) lines.push(`Odor: ${assessment.odor}.`);
  if(assessment.periwound) lines.push(`Periwound skin: ${assessment.periwound}.`);
  if(assessment.underminingCm) lines.push(`Undermining: ${assessment.underminingCm} centimeters.`);
  if(assessment.tunnelingCm) lines.push(`Tunneling: ${assessment.tunnelingCm} centimeters.`);
  const bs = computeBiofilmScore(assessment);
  if(bs > 0.4) lines.push(`Biofilm suspicion: ${(bs*100).toFixed(0)} percent.`);
  if(forecast){
    lines.push(`Expected healing: ${forecast.expectedDays} days.`);
    lines.push(`Range: ${forecast.optimisticDays} to ${forecast.pessimisticDays} days.`);
    lines.push(`Confidence: ${forecast.confidence}.`);
  }
  if(assessment.notes) lines.push(`Notes: ${assessment.notes}`);
  lines.push('End of report.');
  speak(lines.join(' '));
  toast('Reading aloud… tap 🛑 to stop');
}

async function readPatientAloud(patient, wounds){
  const lines = [];
  lines.push(`Patient ${patient.name}.`);
  if(patient.mrn) lines.push(`Medical record number ${patient.mrn}.`);
  if(patient.dob) lines.push(`Date of birth ${patient.dob}.`);
  if(patient.sex) lines.push(`Sex: ${patient.sex}.`);
  const conds = [];
  if(patient.diabetes) conds.push(patient.hba1c ? `diabetes with HBA1C ${patient.hba1c}` : 'diabetes');
  if(patient.pvd) conds.push('peripheral vascular disease');
  if(patient.smoker) conds.push('smoker');
  if(conds.length) lines.push(`Comorbidities: ${conds.join(', ')}.`);
  if(patient.abi) lines.push(`Ankle brachial index: ${patient.abi}.`);
  if(patient.albumin) lines.push(`Albumin: ${patient.albumin}.`);
  if(wounds && wounds.length){
    lines.push(`${wounds.length} wound${wounds.length>1?'s':''} recorded.`);
    for(const w of wounds.slice(0,5)) lines.push(`${w.label}, ${w.status}.`);
  }
  speak(lines.join(' '));
}

function toggleDictation(targetEl){
  if(_recognition){ stopDictation(); return; }
  if(!hasSR){ toast('Voice input not available on this device'); return; }
  try{
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    _recognition = new SR();
    _recognition.continuous = true;
    _recognition.interimResults = true;
    _recognition.lang = 'en-US';
    let finalText = targetEl.value || '';
    _recognition.onresult = (ev) => {
      let interim = '';
      for(let i = ev.resultIndex; i < ev.results.length; i++){
        const t = ev.results[i][0].transcript;
        if(ev.results[i].isFinal) finalText += (finalText && !finalText.endsWith(' ')?' ':'') + t;
        else interim += t;
      }
      targetEl.value = finalText + (interim?' '+interim:'');
    };
    _recognition.onerror = (e) => { toast('Dictation error: '+e.error); stopDictation(); };
    _recognition.onend = () => {};
    _recognition.start();
    toast('Listening… tap again to stop');
  }catch(e){ toast('Could not start dictation: '+e.message); }
}
function stopDictation(){
  if(_recognition){ try{ _recognition.stop(); }catch(e){} _recognition = null; }
}

/* ═══════════════════════════════════════════════════════════════════
   ADVANCED TISSUE MODULE
   ═══════════════════════════════════════════════════════════════════ */
const TISSUE_COLORS = {
  granulation: [225, 29, 72, 140],
  slough:      [234, 179, 8, 140],
  necrosis:    [31, 41, 55, 160],
  epithelial:  [249, 168, 212, 140],
  other:       [203, 213, 225, 80],
};

async function buildTissueHeatmap(canvas, mask, W, H){
  const data = canvas.getContext('2d').getImageData(0,0,W,H).data;
  const out = document.createElement('canvas');
  out.width = W; out.height = H;
  const ctx = out.getContext('2d');
  const img = ctx.createImageData(W, H);
  for(let i = 0; i < W*H; i++){
    if(!mask[i]) continue;
    const r = data[i*4], g = data[i*4+1], b = data[i*4+2];
    const cls = classifyPixelColor(r,g,b);
    const c = TISSUE_COLORS[cls];
    img.data[i*4]   = c[0];
    img.data[i*4+1] = c[1];
    img.data[i*4+2] = c[2];
    img.data[i*4+3] = c[3];
  }
  ctx.putImageData(img, 0, 0);
  return new Promise(res => out.toBlob(res, 'image/png'));
}

function erodeMask(mask, W, H, iterations){
  let cur = mask;
  for(let k = 0; k < iterations; k++){
    const next = new Uint8Array(W*H);
    for(let y = 1; y < H-1; y++) for(let x = 1; x < W-1; x++){
      const i = y*W + x;
      if(cur[i] && cur[i-1] && cur[i+1] && cur[i-W] && cur[i+W]) next[i] = 1;
    }
    cur = next;
  }
  return cur;
}

function computeZones(canvas, mask, W, H){
  const data = canvas.getContext('2d').getImageData(0,0,W,H).data;
  const maskPx = mask.reduce((a,b)=>a+b,0);
  const erosionDepth = Math.max(3, Math.round(Math.sqrt(maskPx) * 0.15));
  const center = erodeMask(mask, W, H, erosionDepth);
  const centerCounts = {granulation:0, slough:0, necrosis:0, epithelial:0, other:0};
  const edgeCounts   = {granulation:0, slough:0, necrosis:0, epithelial:0, other:0};
  let centerTotal = 0, edgeTotal = 0;
  for(let i = 0; i < W*H; i++){
    if(!mask[i]) continue;
    const r = data[i*4], g = data[i*4+1], b = data[i*4+2];
    const cls = classifyPixelColor(r,g,b);
    if(center[i]){ centerCounts[cls]++; centerTotal++; }
    else          { edgeCounts[cls]++;   edgeTotal++;   }
  }
  const pct = (counts, total) => {
    const o = {};
    for(const k in counts) o[k] = +((counts[k] / (total||1)) * 100).toFixed(1);
    return o;
  };
  return {
    center: pct(centerCounts, centerTotal),
    edge:   pct(edgeCounts, edgeTotal),
    healingFromEdges: (edgeCounts.epithelial + edgeCounts.granulation) > (centerCounts.epithelial + centerCounts.granulation),
  };
}

async function computeErythemaMap(canvas, mask, W, H){
  const data = canvas.getContext('2d').getImageData(0,0,W,H).data;
  const out = document.createElement('canvas');
  out.width = W; out.height = H;
  const ctx = out.getContext('2d');
  const img = ctx.createImageData(W, H);
  let redPixels = 0, periwoundPixels = 0;
  for(let i = 0; i < W*H; i++){
    if(mask[i]) continue;
    const r = data[i*4], g = data[i*4+1], b = data[i*4+2];
    const redness = (r - (g+b)/2);
    if(redness > 20){
      redPixels++;
      img.data[i*4]   = 255;
      img.data[i*4+1] = 60;
      img.data[i*4+2] = 60;
      img.data[i*4+3] = Math.min(200, Math.round(redness * 2.5));
    }
    periwoundPixels++;
  }
  ctx.putImageData(img, 0, 0);
  const score = periwoundPixels ? redPixels / periwoundPixels : 0;
  return new Promise(res => {
    out.toBlob(blob => res({ blob, score: +score.toFixed(3), pixelCount: redPixels }), 'image/png');
  });
}

function computeBiofilmScore(assessment){
  if(!assessment) return 0;
  const slough = (assessment.tissue?.slough || 0) / 100;
  const gran   = (assessment.tissue?.granulation || 0) / 100;
  const moist  = assessment.exudate === 'high' ? 1 : assessment.exudate === 'moderate' ? 0.6 : 0.3;
  const inf    = assessment.infection || 0;
  const score  = (slough * 0.5) + (moist * 0.2) + (inf * 0.2) + ((1 - gran) * 0.1);
  return +Math.min(1, score).toFixed(2);
}

function detectTissueTransition(assessments){
  if(!assessments || assessments.length < 2) return null;
  const a = assessments[assessments.length-2];
  const b = assessments[assessments.length-1];
  if(!a.tissue || !b.tissue) return null;
  const out = {};
  for(const k of ['granulation','slough','necrosis','epithelial']){
    const delta = (b.tissue[k] || 0) - (a.tissue[k] || 0);
    if(Math.abs(delta) >= 3) out[k] = { delta: +delta.toFixed(1), direction: delta > 0 ? 'up' : 'down' };
  }
  const parts = [];
  if(out.granulation?.direction === 'up') parts.push('granulation improving');
  if(out.granulation?.direction === 'down') parts.push('granulation decreasing');
  if(out.slough?.direction === 'down') parts.push('slough reducing');
  if(out.slough?.direction === 'up') parts.push('slough increasing');
  if(out.necrosis?.direction === 'up') parts.push('necrosis appearing');
  if(out.necrosis?.direction === 'down') parts.push('necrosis clearing');
  if(out.epithelial?.direction === 'up') parts.push('epithelialization advancing');
  return { changes: out, summary: parts.join(', ') || 'stable tissue composition' };
}

function granulationSloughRatio(assessment){
  if(!assessment?.tissue) return null;
  const g = assessment.tissue.granulation || 0;
  const s = assessment.tissue.slough || 0;
  if(s === 0) return g > 0 ? 99 : null;
  return +(g/s).toFixed(2);
}

function playProgression(images, containerEl){
  if(!images || images.length < 2){ toast('Need 2+ photos'); return; }
  stopProgression();
  containerEl.innerHTML = '';
  const img = document.createElement('img');
  img.style.width = '100%'; img.style.borderRadius = '12px';
  containerEl.appendChild(img);
  const label = document.createElement('div');
  label.style.cssText = 'text-align:center;margin-top:8px;font-size:13px;color:var(--muted)';
  containerEl.appendChild(label);
  let i = 0;
  const tick = () => {
    const rec = images[i];
    img.src = imgSrc(rec);
    label.textContent = `${i+1} / ${images.length} — ${new Date(rec.createdAt).toLocaleDateString()}`;
    i = (i + 1) % images.length;
  };
  tick();
  const timer = setInterval(tick, 1400);
  setTimeout(() => { clearInterval(timer); }, images.length * 1400 + 200);
  window._progressionTimer = timer;
}
function stopProgression(){
  if(window._progressionTimer){ clearInterval(window._progressionTimer); window._progressionTimer = null; }
}

function buildMultiCompare(images){
  if(!images || images.length < 2) return null;
  const n = Math.min(4, images.length);
  const picks = [];
  if(n === 2){ picks.push(images[0], images[images.length-1]); }
  else {
    picks.push(images[0]);
    const step = (images.length - 1) / (n - 1);
    for(let i = 1; i < n-1; i++) picks.push(images[Math.round(i*step)]);
    picks.push(images[images.length-1]);
  }
  return picks;
}

async function enhancePhoto(blobOrDataUrl){
  const img = await new Promise((res, rej) => {
    const i = new Image();
    i.onload = () => res(i); i.onerror = rej;
    i.src = typeof blobOrDataUrl === 'string' ? blobOrDataUrl : URL.createObjectURL(blobOrDataUrl);
  });
  const c = document.createElement('canvas');
  c.width = img.width; c.height = img.height;
  const ctx = c.getContext('2d');
  ctx.drawImage(img, 0, 0);
  const data = ctx.getImageData(0, 0, c.width, c.height);
  let sum = 0;
  for(let i = 0; i < data.data.length; i += 4){
    sum += 0.299*data.data[i] + 0.587*data.data[i+1] + 0.114*data.data[i+2];
  }
  const mean = sum / (data.data.length / 4);
  const gain = Math.max(0.7, Math.min(1.5, 140 / Math.max(1, mean)));
  for(let i = 0; i < data.data.length; i += 4){
    data.data[i]   = Math.min(255, data.data[i]   * gain);
    data.data[i+1] = Math.min(255, data.data[i+1] * gain);
    data.data[i+2] = Math.min(255, data.data[i+2] * gain);
  }
  ctx.putImageData(data, 0, 0);
  return new Promise(res => c.toBlob(res, 'image/jpeg', 0.9));
}

function healingPace(assessments){
  if(!assessments || assessments.length < 2) return null;
  const twoWeeksAgo = Date.now() - 14*24*60*60*1000;
  const recent = assessments.filter(a => a.createdAt >= twoWeeksAgo && a.areaCm2);
  if(recent.length < 2) return null;
  const first = recent[0], last = recent[recent.length-1];
  const days = (last.createdAt - first.createdAt) / (24*60*60*1000);
  const delta = first.areaCm2 - last.areaCm2;
  return {
    days: +days.toFixed(1),
    deltaCm2: +delta.toFixed(2),
    cm2PerWeek: +(delta / days * 7).toFixed(2),
    direction: delta > 0.1 ? 'improving' : delta < -0.1 ? 'worsening' : 'stable',
  };
}

async function doLogin(){
  try{
    // Failed attempt lockout
    const lockUntil = (await DB.get('settings','lock_until'))?.v || 0;
    if(lockUntil > Date.now()){
      const mins = Math.ceil((lockUntil - Date.now())/60000);
      toast('Locked for '+mins+' min — too many wrong PINs', 4000);
      return;
    }
    const pin = $('#pin').value;
    let saved = '0000';
    try{ saved = (await DB.get('settings','pin'))?.v || '0000'; }catch(e){}
    if(pin === saved){
      state.failedAttempts = 0;
      await DB.put('settings',{k:'failed_attempts', v:0});
      try{ sessionStorage.setItem('yulto-in','1'); }catch(e){}
      $('#login').classList.add('hidden');
      $('#app').classList.remove('hidden');
      logAudit('login',{});
      maybeAutoBackup();
      go('home');
    } else {
      state.failedAttempts = (state.failedAttempts || 0) + 1;
      await DB.put('settings',{k:'failed_attempts', v:state.failedAttempts});
      if(state.failedAttempts >= 5){
        await DB.put('settings',{k:'lock_until', v:Date.now() + 5*60*1000});
        toast('Too many attempts. Locked for 5 minutes.', 4000);
      } else {
        toast('Wrong PIN ('+state.failedAttempts+'/5)');
      }
      $('#pin').value = '';
    }
  }catch(e){
    $('#login').classList.add('hidden');
    $('#app').classList.remove('hidden');
    go('home');
  }
}
$('#pin')?.addEventListener('keydown',e=>{if(e.key==='Enter')doLogin()});

function go(screen,opts){
  state.screen = screen;
  if(opts?.patient) state.currentPatient = opts.patient;
  if(opts?.wound) state.currentWound = opts.wound;
  $$('#nav button').forEach(b=>b.classList.toggle('active', b.dataset.tab === screen));
  render(); window.scrollTo(0,0);
}
async function render(){
  const v = $('#view'); v.innerHTML = '';
  switch(state.screen){
    case 'home': await renderHome(v); break;
    case 'patients': await renderPatients(v); break;
    case 'patient': await renderPatient(v); break;
    case 'wound': await renderWound(v); break;
    case 'settings': await renderSettings(v); break;
    case 'stats': await renderStats(v); break;
    case 'scores': await renderScores(v); break;
    case 'timeline': await renderTimeline(v); break;
    case 'compare': await renderCompare(v); break;
    case 'progression': await renderProgression(v); break;
    case 'heatmap': await renderHeatmap(v); break;
    case 'handout': await renderHandout(v); break;
  }
}

/* ─── Stats dashboard ─── */
async function renderStats(v){
  const patients = await DB.all('patients');
  const wounds = await DB.all('wounds');
  const assessments = await DB.all('assessments');
  const byType = {};
  for(const w of wounds){ byType[w.type || 'other'] = (byType[w.type || 'other'] || 0) + 1; }
  const healed = wounds.filter(w=>w.status === 'healed');
  let totalHealingDays = 0, count = 0;
  for(const w of healed){
    const ass = (await DB.all('assessments','woundId',w.id)).sort((a,b)=>a.createdAt-b.createdAt);
    if(ass.length > 1){
      totalHealingDays += (ass[ass.length-1].createdAt - ass[0].createdAt)/(24*60*60*1000);
      count++;
    }
  }
  const avgHealing = count ? Math.round(totalHealingDays/count) : 0;
  const coverage = patients.length ? Math.round((wounds.filter(w=>w.status!=='healed').length / Math.max(1,patients.length))*100) : 0;

  const typeLabels = Object.keys(byType);

function drawPie(values, colors){
  const c = $('#pieChart'); if(!c) return;
  const dpr = window.devicePixelRatio || 1;
  const w = c.clientWidth, h = 180;
  c.width = w*dpr; c.height = h*dpr;
  const ctx = c.getContext('2d'); ctx.scale(dpr,dpr);
  const total = values.reduce((a,b)=>a+b,0);
  if(!total) return;
  const cx = w/2, cy = h/2, r = Math.min(w,h)*0.4;
  let angle = -Math.PI/2;
  values.forEach((val,i)=>{
    const slice = (val/total) * Math.PI * 2;
    ctx.beginPath(); ctx.moveTo(cx,cy);
    ctx.arc(cx, cy, r, angle, angle+slice);
    ctx.closePath();
    ctx.fillStyle = colors[i%colors.length];
    ctx.fill();
    angle += slice;
  });
  ctx.beginPath(); ctx.arc(cx, cy, r*0.5, 0, Math.PI*2);
  ctx.fillStyle = '#fff'; ctx.fill();
  ctx.fillStyle = '#0f172a'; ctx.font = 'bold 20px system-ui'; ctx.textAlign = 'center';
  ctx.fillText(String(total), cx, cy+7);
}

function assessmentFlags(ass){
  if(ass.length < 2) return {cls:'new', icon:'🆕', label:'New wound — baseline recorded'};
  const a1 = ass[ass.length-2], a2 = ass[ass.length-1];
  if(!a1.areaCm2 || !a2.areaCm2) return null;
  const change = (a2.areaCm2 - a1.areaCm2) / a1.areaCm2;
  const days = (a2.createdAt - a1.createdAt)/(24*60*60*1000);
  if(change < -0.1) return {cls:'improving', icon:'✓', label:'Improving ('+(change*100).toFixed(0)+'% area)'};
  if(change > 0.1) return {cls:'deteriorating', icon:'⚠', label:'Deteriorating (+'+(change*100).toFixed(0)+'% area)'};
  if(days > 14 && Math.abs(change) < 0.05) return {cls:'stalled', icon:'⏸', label:'Stalled — no change in '+Math.round(days)+' days'};
  return {cls:'new', icon:'•', label:'Stable'};
}
function computeRiskStratification(latest, patient){
  if(!latest) return {level:'low', label:'Low'};
  let score = 0;
  if(latest.areaCm2 > 4) score += 2; else if(latest.areaCm2 > 2) score += 1;
  if((latest.tissue?.necrosis || 0) > 20) score += 2;
  if(latest.infection > 0.6) score += 2; else if(latest.infection > 0.3) score += 1;
  if(patient?.diabetes) score += 1;
  if(patient?.pvd) score += 2;
  if(score >= 4) return {level:'high', label:'High'};
  if(score >= 2) return {level:'medium', label:'Medium'};
  return {level:'low', label:'Low'};
}
function imgSrc(rec){
  if(rec.dataUrl) return rec.dataUrl;
  if(rec.blob) return URL.createObjectURL(rec.blob);
  return '';
}
function calcPAR(ass){
  const withArea = ass.filter(a=>a.areaCm2);
  if(withArea.length < 2) return null;
  const first = withArea[0].areaCm2, last = withArea[withArea.length-1].areaCm2;
  if(!first) return null;
  return ((first-last)/first)*100;
}
function drawChart(ass){
  const c = $('#chart'); if(!c) return;
  const dpr = window.devicePixelRatio || 1;
  const w = c.clientWidth, h = 180;
  c.width = w*dpr; c.height = h*dpr;
  const ctx = c.getContext('2d'); ctx.scale(dpr,dpr);
  const data = ass.filter(a=>a.areaCm2).map(a=>({x:a.createdAt, y:a.areaCm2}));
  if(data.length < 2) return;
  const pad = 34;
  const xs = data.map(d=>d.x), ys = data.map(d=>d.y);
  const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = 0, y1 = Math.max(...ys)*1.15;
  const px = x => pad + (x-x0)/(x1-x0||1)*(w-pad*2);
  const py = y => h-pad - (y-y0)/(y1-y0||1)*(h-pad*2);
  ctx.strokeStyle='#e2e8f0'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(pad,h-pad); ctx.lineTo(w-pad,h-pad); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(pad,pad); ctx.lineTo(pad,h-pad); ctx.stroke();
  ctx.fillStyle='#94a3b8'; ctx.font='10px sans-serif';
  ctx.fillText(y1.toFixed(1)+' cm²', 4, pad-6); ctx.fillText('0', 4, h-pad);
  ctx.strokeStyle='#2563eb'; ctx.lineWidth=2.5;
  ctx.beginPath();
  data.forEach((d,i)=>{ const X=px(d.x), Y=py(d.y); i?ctx.lineTo(X,Y):ctx.moveTo(X,Y); });
  ctx.stroke();
  ctx.fillStyle='#2563eb';
  data.forEach(d=>{ ctx.beginPath(); ctx.arc(px(d.x), py(d.y), 3.5, 0, 7); ctx.fill(); });
  ctx.fillStyle='#94a3b8'; ctx.font='10px sans-serif'; ctx.textAlign='center';
  data.forEach((d,i)=>{ if(i===0 || i===data.length-1) ctx.fillText(fmtShort(d.x), px(d.x), h-10); });
  ctx.textAlign='left';
}

function forecastHealing(latest, ass, wound){
  const area = latest.areaCm2;
  if(!area || area <= 0) return {expectedDays:0,optimisticDays:0,pessimisticDays:0,ratePerWeek:0,confidence:'high',basedOnTrajectory:false};
  const withArea = ass.filter(a=>a.areaCm2);
  if(withArea.length >= 2){
    const first = withArea[0], last = withArea[withArea.length-1];
    const days = (last.createdAt - first.createdAt)/(24*60*60*1000);
    if(days >= 1 && first.areaCm2 > last.areaCm2){
      const ratePerDay = (first.areaCm2 - last.areaCm2)/days;
      return {
        expectedDays: clamp(Math.round(area/ratePerDay),3,365),
        optimisticDays: clamp(Math.round(area/(ratePerDay*1.35)),3,365),
        pessimisticDays: clamp(Math.round(area/(ratePerDay*0.6)),3,365),
        ratePerWeek: ratePerDay*7, confidence:'high', basedOnTrajectory:true
      };
    }
  }
  const BASE = {diabetic_foot:0.55,pressure_ulcer:0.65,venous_ulcer:0.85,arterial_ulcer:0.70,surgical:1.20,burn:0.90,rash:1.80,other:0.80};
  let rate = BASE[wound?.type || 'other'] || 0.8;
  const t = latest.tissue || {};
  rate *= (0.7 + (t.granulation||0)/100 * 0.6);
  rate *= (1 - (t.necrosis||0)/100 * 0.6);
  rate *= (1 - (t.slough||0)/100 * 0.25);
  rate *= (1 + (t.epithelial||0)/100 * 0.4);
  const p = state.currentPatient || {};
  if(p.diabetes){ rate *= 0.7; if((p.hba1c||7) > 8) rate *= 0.8; }
  if(p.pvd) rate *= 0.65;
  if(p.smoker) rate *= 0.8;
  rate *= (1 - (latest.infection||0) * 0.55);
  const ratePerDay = rate/7;
  return {
    expectedDays: clamp(Math.round(area/ratePerDay),3,365),
    optimisticDays: clamp(Math.round(area/(ratePerDay*1.4)),3,365),
    pessimisticDays: clamp(Math.round(area/(ratePerDay*0.6)),3,365),
    ratePerWeek: rate, confidence:'medium', basedOnTrajectory:false
  };
}

async function generateHeatmapsFor(imgRec){
  try{
    const dataUrl = imgRec.dataUrl || (imgRec.blob ? await blobToBase64(imgRec.blob) : null);
    if(!dataUrl) { $('#hmBox').innerHTML = '<div class="muted">No image data</div>'; return; }
    const img = await new Promise((res, rej) => {
      const i = new Image();
      i.onload = () => res(i); i.onerror = rej; i.src = dataUrl;
    });
    const MAX = 700;
    const scale = Math.min(1, MAX/Math.max(img.width, img.height));
    const W = Math.round(img.width*scale), H = Math.round(img.height*scale);
    const canvas = document.createElement('canvas');
    canvas.width = W; canvas.height = H;
    const ctx = canvas.getContext('2d', {willReadFrequently:true});
    ctx.drawImage(img, 0, 0, W, H);
    const data = ctx.getImageData(0, 0, W, H).data;

    // Segment
    let mask;
    if(state.aiReady){
      try{
        const tensor = tf.browser.fromPixels(canvas).resizeBilinear([256,256]).toFloat().div(255).expandDims(0);
        const output = state.woundModel.predict(tensor);
        const maskData = await output.data();
        tf.dispose([tensor, output]);
        const raw = new Uint8Array(256*256);
        for(let i = 0; i < 256*256; i++) raw[i] = maskData[i] > 0.5 ? 1 : 0;
        const largest = largestComponent(raw, 256, 256);
        mask = new Uint8Array(W*H);
        for(let y = 0; y < H; y++) for(let x = 0; x < W; x++){
          mask[y*W+x] = largest[Math.floor(y*256/H)*256 + Math.floor(x*256/W)];
        }
      } catch(e){ mask = segmentWoundFallback(data, W, H); }
    } else {
      mask = segmentWoundFallback(data, W, H);
    }

    // Build all three views
    const tissueBlob = await buildTissueHeatmap(canvas, mask, W, H);
    const erResult = await computeErythemaMap(canvas, mask, W, H);
    const zones = computeZones(canvas, mask, W, H);

    window._hmData = {
      tissue: URL.createObjectURL(tissueBlob),
      ery: URL.createObjectURL(erResult.blob),
      orig: dataUrl,
      eryScore: erResult.score,
      zones,
    };

    // Show tissue by default
    showHmTab('tissue');

    // Zone analysis card
    const z = zones;
    $('#zoneBox').style.display = 'block';
    $('#zoneBox').innerHTML = `
      <b>Zone analysis</b>
      <div class="muted" style="font-size:12px;margin-top:4px">Center vs edge tissue composition</div>
      <div style="margin-top:12px">
        <div class="muted" style="font-size:11px;font-weight:600">CENTER</div>
        <div class="zone-bar">${tissueColors.map(t=>{const val=z.center[t.key]||0;return val>0?`<div style="width:${val}%;background:${t.color}"></div>`:''}).join('')}</div>
        <div class="zone-label"><span>Gran ${z.center.granulation||0}% · Slough ${z.center.slough||0}%</span><span>Necr ${z.center.necrosis||0}%</span></div>
      </div>
      <div style="margin-top:12px">
        <div class="muted" style="font-size:11px;font-weight:600">EDGE</div>
        <div class="zone-bar">${tissueColors.map(t=>{const val=z.edge[t.key]||0;return val>0?`<div style="width:${val}%;background:${t.color}"></div>`:''}).join('')}</div>
        <div class="zone-label"><span>Gran ${z.edge.granulation||0}% · Slough ${z.edge.slough||0}%</span><span>Epith ${z.edge.epithelial||0}%</span></div>
      </div>
      ${z.healingFromEdges ? '<div style="margin-top:10px;font-size:12px;color:var(--ok);font-weight:600">✓ Healing from edges — good sign</div>' : '<div style="margin-top:10px;font-size:12px;color:var(--warn);font-weight:600">⚠ Center-dominant healing pattern</div>'}
      <div style="margin-top:12px;padding-top:12px;border-top:1px solid var(--line)">
        <div class="row between"><span style="font-size:13px">Erythema (redness) around wound</span><b style="color:${erResult.score>0.15?'var(--danger)':erResult.score>0.07?'var(--warn)':'var(--ok)'}">${(erResult.score*100).toFixed(0)}%</b></div>
      </div>`;
  }catch(e){
    $('#hmBox').innerHTML = '<div class="muted">Heatmap failed: '+esc(e.message)+'</div>';
  }
}

function calcPUSH(a){
  const area = a.areaCm2 || 0;
  let areaScore = 0;
  if(area===0)areaScore=0;else if(area<0.3)areaScore=1;else if(area<=0.6)areaScore=2;else if(area<=1.0)areaScore=3;else if(area<=2.0)areaScore=4;else if(area<=3.0)areaScore=5;else if(area<=4.0)areaScore=6;else if(area<=8.0)areaScore=7;else if(area<=12.0)areaScore=8;else if(area<=24.0)areaScore=9;else areaScore=10;
  let tissueScore = 2;
  const t = a.tissue || {};
  if((t.necrosis||0) > 0) tissueScore=4; else if((t.slough||0) > 0) tissueScore=3;
  else if((t.epithelial||0) > 50) tissueScore=1; else if((t.granulation||0) > 0) tissueScore=2;
  let exudateScore = 1;
  if(a.exudate === 'moderate') exudateScore=2; else if(a.exudate === 'high') exudateScore=3;
  return {area:areaScore, exudate:exudateScore, tissue:tissueScore, total:areaScore+exudateScore+tissueScore};
}
function calcBates(a){
  const area = a.areaCm2 || 0; const depth = a.depthCm || 0; const t = a.tissue || {};
  const size = area<1?1:area<4?2:area<10?3:area<20?4:5;
  const dep = depth<0.1?1:depth<0.3?2:depth<0.6?3:depth<1.0?4:5;
  const necroType = (t.necrosis||0)>0?5:(t.slough||0)>0?3:1;
  const necroAmt = (t.necrosis||0)>50?5:(t.necrosis||0)>0?4:(t.slough||0)>50?3:(t.slough||0)>0?2:1;
  const gran = (t.granulation||0)>75?1:(t.granulation||0)>50?2:(t.granulation||0)>25?3:(t.granulation||0)>0?4:5;
  const epit = (t.epithelial||0)>75?1:(t.epithelial||0)>50?2:(t.epithelial||0)>25?3:(t.epithelial||0)>0?4:5;
  const total = size+dep+necroType+necroAmt+gran+epit+(5*7);
  const sev = total<=20?'Minimal':total<=30?'Mild':total<=40?'Moderate':'Severe';
  return {size, depth:dep, necroticType:necroType, necroticAmount:necroAmt, granulation:gran, epithelialization:epit, total, severity:sev};
}
function calcWagner(a){
  const d = a.depthCm || 0;
  const infected = (a.infection || 0) > 0.5;
  const necrotic = (a.tissue?.necrosis || 0) > 20;
  if(necrotic && infected) return {grade:'4', label:'Localized gangrene'};
  if(necrotic) return {grade:'5', label:'Extensive gangrene'};
  if(infected && d > 0.3) return {grade:'3', label:'Deep ulcer with abscess'};
  if(infected) return {grade:'2', label:'Deep ulcer with infection'};
  if(d > 0.3) return {grade:'1', label:'Deep ulcer to tendon/bone'};
  return {grade:'0', label:'No ulcer'};
}
function calcPressureStage(a, w){
  if(w?.type !== 'pressure_ulcer') return {label:'N/A', detail:'Not a pressure ulcer'};
  const d = a.depthCm || 0;
  if(d > 1.0) return {label:'Stage 4', detail:'Full-thickness, bone/tendon visible'};
  if(d > 0.6) return {label:'Stage 3', detail:'Full-thickness tissue loss'};
  if(d > 0.1) return {label:'Stage 2', detail:'Partial-thickness loss'};
  return {label:'Stage 1', detail:'Non-blanchable erythema'};
}
function calcCEAP(a, w){
  if(w?.type !== 'venous_ulcer') return {clinical:'0', label:'No venous disease'};
  const d = a.depthCm || 0;
  if(d > 0.3) return {clinical:'6', label:'Active venous ulcer'};
  if((a.infection||0) > 0.5) return {clinical:'5', label:'Healed with skin changes'};
  return {clinical:'4', label:'Skin changes'};
}
function calcDESIGN(a){
  const t = a.tissue || {};
  const d = a.depthCm || 0;
  // Simplified DESIGN (0-3 each, 6 items = 0-18)
  const depth = d < 0.1 ? 0 : d < 0.3 ? 1 : d < 0.6 ? 2 : 3;
  const inf = (a.infection || 0) > 0.6 ? 3 : (a.infection || 0) > 0.3 ? 2 : (a.infection || 0) > 0.1 ? 1 : 0;
  const sens = a.pain != null ? Math.min(3, Math.round(a.pain / 3.3)) : 1;
  const tissue = (t.necrosis || 0) > 30 ? 3 : (t.slough || 0) > 50 ? 2 : (t.slough || 0) > 20 ? 1 : 0;
  const edema = a.periwound === 'edema' ? 2 : 1;
  const size = (a.areaCm2 || 0) > 10 ? 3 : (a.areaCm2 || 0) > 4 ? 2 : (a.areaCm2 || 0) > 1 ? 1 : 0;
  const total = depth + inf + sens + tissue + edema + size;
  const sev = total <= 6 ? 'Low' : total <= 11 ? 'Moderate' : 'High';
  return {total, severity: sev};
}
function calcWBP(a){
  const t = a.tissue || {};
  let score = 0;
  if ((t.granulation || 0) > 50) score += 3; else if ((t.granulation || 0) > 20) score += 2; else score += 1;
  if ((t.necrosis || 0) < 10) score += 3; else if ((t.necrosis || 0) < 30) score += 2; else score += 1;
  if ((a.infection || 0) < 0.2) score += 3; else if ((a.infection || 0) < 0.5) score += 2; else score += 1;
  if (a.exudate === 'low' || a.exudate === 'none') score += 3; else if (a.exudate === 'moderate') score += 2; else score += 1;
  const label = score >= 10 ? 'Ready for healing' : score >= 7 ? 'Preparing' : 'Needs intervention';
  return { score, label };
}
function calcTIMES(a){
  const t = a.tissue || {};
  let T = 'Granulating';
  if((t.necrosis||0) > 20) T = 'Necrotic';
  else if((t.slough||0) > 30) T = 'Sloughy';
  else if((t.epithelial||0) > 30) T = 'Epithelializing';
  let I = (a.infection||0) > 0.5 ? 'Infected' : (a.infection||0) > 0.3 ? 'Colonized' : 'Clean';
  let M = a.exudate === 'high' ? 'High' : a.exudate === 'moderate' ? 'Moderate' : a.exudate === 'low' ? 'Low' : 'Balanced';
  let E = (t.granulation||0) > 30 ? 'Advancing' : 'Non-advancing';
  let S = a.periwound === 'macerated' ? 'Macerated' : a.periwound === 'erythema' ? 'Erythema' : 'Healthy';
  return {T, I, M, E, S};
}

  };

/* ─── AI pipeline (same as v5) ─── */
async function analyzeWound(img, patient, markerMm, onStep){
  const step = (msg,pct) => onStep && onStep({msg,pct});
  const MAX = 1024;
  const scale = Math.min(1, MAX/Math.max(img.width, img.height));
  const W = Math.round(img.width*scale), H = Math.round(img.height*scale);
  const canvas = document.createElement('canvas'); canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d', {willReadFrequently:true});
  ctx.drawImage(img, 0, 0, W, H);
  const data = ctx.getImageData(0, 0, W, H).data;

  step('Detecting marker…', 15);
  const marker = detectMarker(data, W, H);
  const calibrated = !!marker;
  const cmPerPx = marker ? (markerMm/10)/marker.sidePx : 15/W;

  step('Segmenting wound…', 35);
  let mask;
  if(state.aiReady){
    try{
      const tensor = tf.browser.fromPixels(canvas).resizeBilinear([256,256]).toFloat().div(255).expandDims(0);
      const output = state.woundModel.predict(tensor);
      const maskData = await output.data();
      tf.dispose([tensor, output]);
      const raw = new Uint8Array(256*256);
      for(let i = 0; i < 256*256; i++) raw[i] = maskData[i] > 0.5 ? 1 : 0;
      const largest = largestComponent(raw, 256, 256);
      mask = new Uint8Array(W*H);
      for(let y = 0; y < H; y++) for(let x = 0; x < W; x++){
        mask[y*W+x] = largest[Math.floor(y*256/H)*256 + Math.floor(x*256/W)];
      }
    } catch(e){ mask = segmentWoundFallback(data, W, H); }
  } else { mask = segmentWoundFallback(data, W, H); }

  const maskPx = mask.reduce((a,b)=>a + (b ? 1 : 0), 0);
  if(maskPx < 50) throw new Error('No wound detected');

  let minX = W, minY = H, maxX = 0, maxY = 0;
  for(let y = 0; y < H; y++) for(let x = 0; x < W; x++){
    if(mask[y*W+x]){
      if(x < minX) minX = x; if(x > maxX) maxX = x;
      if(y < minY) minY = y; if(y > maxY) maxY = y;
    }
  }
  const bboxW = maxX - minX + 1, bboxH = maxY - minY + 1;
  const areaCm2 = +(maskPx * cmPerPx * cmPerPx).toFixed(2);
  const lengthCm = +(bboxH * cmPerPx).toFixed(2);
  const widthCm = +(bboxW * cmPerPx).toFixed(2);

  let perimPx = 0;
  for(let y = 1; y < H-1; y++) for(let x = 1; x < W-1; x++){
    const i = y*W + x;
    if(mask[i] && (!mask[i-1] || !mask[i+1] || !mask[i-W] || !mask[i+W])) perimPx++;
  }
  const perimeterCm = +(perimPx * cmPerPx).toFixed(2);
  const circularity = perimeterCm > 0 ? (4 * Math.PI * areaCm2) / (perimeterCm * perimeterCm) : 0;
  const elongation = bboxW > 0 ? Math.max(bboxW, bboxH) / Math.min(bboxW, bboxH) : 1;
  const edgeIrregularity = computeEdgeIrregularity(mask, W, H, maskPx, perimPx);

  step('Classifying tissue…', 70);
  const tissue = classifyTissueColor(data, W, H, mask);

  step('Infection analysis…', 88);
  const infection = estimateInfection(data, W, H, mask, minX, minY, maxX, maxY, tissue);
  const healingIndex = computeHealingIndex({area:areaCm2, tissue, infection, patient});

  step('Done', 100);
  return {
    areaCm2, perimeterCm, lengthCm, widthCm, depthCm:null, volumeCm3:null,
    tissue, infection, healingIndex, calibrated,
    circularity:+circularity.toFixed(3),
    elongation:+elongation.toFixed(2),
    edgeIrregularity:+edgeIrregularity.toFixed(2)
  };
}
function computeEdgeIrregularity(mask, W, H, maskPx, perimPx){
  if(maskPx < 4) return 1;
  const perfectCirclePerim = 2 * Math.sqrt(Math.PI * maskPx);
  return Math.max(1, perimPx / perfectCirclePerim);
}
function segmentWoundFallback(data, W, H){
  const n = W*H;
  const L = new Float32Array(n);
  for(let i = 0; i < n; i++){
    const r = data[i*4], g = data[i*4+1], b = data[i*4+2];
    L[i] = 0.299*r + 0.587*g + 0.114*b;
  }
  const bg = boxBlur(L, W, H, 24);
  const mask = new Uint8Array(n);
  for(let i = 0; i < n; i++){
    if(bg[i] - L[i] > 12) mask[i] = 1;
  }
  let m = morphClose(mask, W, H, 4);
  m = morphOpen(m, W, H, 3);
  return largestComponent(m, W, H);
}
function boxBlur(src, W, H, r){
  const tmp = new Float32Array(W*H), out = new Float32Array(W*H);
  for(let y = 0; y < H; y++){
    let sum = 0, cnt = 0;
    for(let x = -r; x <= r; x++){ const xx = Math.max(0, Math.min(W-1, x)); sum += src[y*W+xx]; cnt++; }
    for(let x = 0; x < W; x++){
      tmp[y*W+x] = sum/cnt;
      const xr = Math.min(W-1, x+r), xl = Math.max(0, x-r-1);
      sum += src[y*W+xr] - src[y*W+xl];
    }
  }
  for(let x = 0; x < W; x++){
    let sum = 0, cnt = 0;
    for(let y = -r; y <= r; y++){ const yy = Math.max(0, Math.min(H-1, y)); sum += tmp[yy*W+x]; cnt++; }
    for(let y = 0; y < H; y++){
      out[y*W+x] = sum/cnt;
      const yr = Math.min(H-1, y+r), yl = Math.max(0, y-r-1);
      sum += tmp[yr*W+x] - tmp[yl*W+x];
    }
  }
  return out;
}
function morphClose(m, W, H, r){ return erode(dilate(m, W, H, r), W, H, r); }
function morphOpen(m, W, H, r){ return dilate(erode(m, W, H, r), W, H, r); }
function dilate(mask, W, H, r){
  const tmp = new Uint8Array(W*H), out = new Uint8Array(W*H);
  for(let y = 0; y < H; y++) for(let x = 0; x < W; x++){
    let any = 0;
    for(let dx = -r; dx <= r; dx++){ const xx = x+dx; if(xx >= 0 && xx < W && mask[y*W+xx]){ any = 1; break; } }
    tmp[y*W+x] = any;
  }
  for(let x = 0; x < W; x++) for(let y = 0; y < H; y++){
    let any = 0;
    for(let dy = -r; dy <= r; dy++){ const yy = y+dy; if(yy >= 0 && yy < H && tmp[yy*W+x]){ any = 1; break; } }
    out[y*W+x] = any;
  }
  return out;
}
function erode(mask, W, H, r){
  const tmp = new Uint8Array(W*H), out = new Uint8Array(W*H);
  for(let y = 0; y < H; y++) for(let x = 0; x < W; x++){
    let all = 1;
    for(let dx = -r; dx <= r; dx++){ const xx = x+dx; if(xx < 0 || xx >= W || !mask[y*W+xx]){ all = 0; break; } }
    tmp[y*W+x] = all;
  }
  for(let x = 0; x < W; x++) for(let y = 0; y < H; y++){
    let all = 1;
    for(let dy = -r; dy <= r; dy++){ const yy = y+dy; if(yy < 0 || yy >= H || !tmp[yy*W+x]){ all = 0; break; } }
    out[y*W+x] = all;
  }
  return out;
}
function largestComponent(mask, W, H){
  const labels = new Int32Array(W*H);
  let cur = 0, best = 0, bestSize = 0;
  const stack = [];
  for(let i = 0; i < W*H; i++){
    if(mask[i] && !labels[i]){
      cur++;
      let size = 0;
      stack.length = 0; stack.push(i); labels[i] = cur;
      while(stack.length){
        const p = stack.pop(); size++;
        const x = p % W, y = (p / W) | 0;
        if(x > 0 && mask[p-1] && !labels[p-1]){ labels[p-1] = cur; stack.push(p-1); }
        if(x < W-1 && mask[p+1] && !labels[p+1]){ labels[p+1] = cur; stack.push(p+1); }
        if(y > 0 && mask[p-W] && !labels[p-W]){ labels[p-W] = cur; stack.push(p-W); }
        if(y < H-1 && mask[p+W] && !labels[p+W]){ labels[p+W] = cur; stack.push(p+W); }
      }
      if(size > bestSize){ bestSize = size; best = cur; }
    }
  }
  const out = new Uint8Array(W*H);
  for(let i = 0; i < W*H; i++) if(labels[i] === best) out[i] = 1;
  return out;
}
function detectMarker(data, W, H){
  const gray = new Uint8Array(W*H);
  for(let i = 0; i < W*H; i++) gray[i] = (data[i*4]*0.299 + data[i*4+1]*0.587 + data[i*4+2]*0.114) | 0;
  const integral = new Float64Array((W+1)*(H+1));
  for(let y = 0; y < H; y++){
    let rs = 0;
    for(let x = 0; x < W; x++){ rs += gray[y*W+x]; integral[(y+1)*(W+1)+(x+1)] = integral[y*(W+1)+(x+1)] + rs; }
  }
  const rectSum = (x0,y0,x1,y1) => integral[(y1+1)*(W+1)+(x1+1)] - integral[y0*(W+1)+(x1+1)] - integral[(y1+1)*(W+1)+x0] + integral[y0*(W+1)+x0];
  const bin = new Uint8Array(W*H); const r = 12;
  for(let y = 0; y < H; y++) for(let x = 0; x < W; x++){
    const x0 = Math.max(0,x-r), y0 = Math.max(0,y-r), x1 = Math.min(W-1,x+r), y1 = Math.min(H-1,y+r);
    const area = (x1-x0+1)*(y1-y0+1);
    const mean = rectSum(x0,y0,x1,y1) / area;
    bin[y*W+x] = gray[y*W+x] < mean - 8 ? 1 : 0;
  }
  const labels = new Int32Array(W*H);
  const comps = []; let cur = 0;
  const stack = [];
  for(let i = 0; i < W*H; i++){
    if(bin[i] && !labels[i]){
      cur++;
      stack.length = 0; stack.push(i); labels[i] = cur;
      let minX = W, minY = H, maxX = 0, maxY = 0, count = 0;
      while(stack.length){
        const p = stack.pop(); count++;
        const x = p % W, y = (p / W) | 0;
        if(x < minX) minX = x; if(x > maxX) maxX = x;
        if(y < minY) minY = y; if(y > maxY) maxY = y;
        if(x > 0 && bin[p-1] && !labels[p-1]){ labels[p-1] = cur; stack.push(p-1); }
        if(x < W-1 && bin[p+1] && !labels[p+1]){ labels[p+1] = cur; stack.push(p+1); }
        if(y > 0 && bin[p-W] && !labels[p-W]){ labels[p-W] = cur; stack.push(p-W); }
        if(y < H-1 && bin[p+W] && !labels[p+W]){ labels[p+W] = cur; stack.push(p+W); }
      }
      comps.push({cur, count, minX, minY, maxX, maxY});
    }
  }
  let best = null, bestScore = 0;
  for(const c of comps){
    const w = c.maxX - c.minX + 1, h = c.maxY - c.minY + 1;
    if(w < 30 || h < 30) continue;
    if(w > W*0.6 || h > H*0.6) continue;
    const aspect = w/h; if(aspect < 0.75 || aspect > 1.35) continue;
    const fill = c.count/(w*h); if(fill < 0.55 || fill > 0.98) continue;
    const score = Math.min(w,h)*fill;
    if(score > bestScore){ bestScore = score; best = {sidePx:(w+h)/2, bbox:c}; }
  }
  return best;
}
function classifyTissueColor(data, W, H, mask){
  const counts = {granulation:0, slough:0, necrosis:0, epithelial:0, other:0};
  let total = 0;
  for(let i = 0; i < W*H; i++){
    if(!mask[i]) continue;
    const r = data[i*4], g = data[i*4+1], b = data[i*4+2];
    counts[classifyPixelColor(r,g,b)]++; total++;
  }
  const tissue = {};
  for(const k in counts) tissue[k] = +((counts[k]/(total||1))*100).toFixed(1);
  return tissue;
}
function classifyPixelColor(r,g,b){
  const lum = 0.299*r + 0.587*g + 0.114*b;
  if(lum < 55) return 'necrosis';
  if(r > 140 && g > 120 && b < 130 && Math.abs(r-g) < 50) return 'slough';
  if(r > 140 && g < r*0.75 && b < r*0.75) return 'granulation';
  if(r > 170 && g > 120 && b > 120) return 'epithelial';
  return 'other';
}
function estimateInfection(data, W, H, mask, minX, minY, maxX, maxY, tissue){
  const pad = Math.max(12, Math.round((maxX-minX)*0.35));
  const x0 = Math.max(0, minX-pad), x1 = Math.min(W-1, maxX+pad);
  const y0 = Math.max(0, minY-pad), y1 = Math.min(H-1, maxY+pad);
  let redPx = 0, skinPx = 0;
  for(let y = y0; y <= y1; y++) for(let x = x0; x <= x1; x++){
    const i = y*W+x;
    if(mask[i]) continue;
    skinPx++;
    const r = data[i*4], g = data[i*4+1], b = data[i*4+2];
    if(r > 150 && r-g > 35 && r-b > 35) redPx++;
  }
  const erythema = skinPx ? redPx/skinPx : 0;
  const slough = (tissue.slough||0)/100, gran = (tissue.granulation||0)/100;
  const tissueSignal = Math.max(0, slough - gran*0.6);
  return +Math.min(1, erythema*0.8 + tissueSignal*0.4).toFixed(3);
}
function computeHealingIndex({area, tissue, infection, patient}){
  let risk = 0;
  if(area > 4) risk += 0.3; else if(area > 2) risk += 0.15;
  if((tissue.necrosis||0) > 20) risk += 0.3; else if((tissue.slough||0) > 40) risk += 0.15;
  if(infection > 0.6) risk += 0.3; else if(infection > 0.3) risk += 0.1;
  if(patient?.diabetes) risk += 0.1;
  if(patient?.pvd) risk += 0.15;
  if(patient?.smoker) risk += 0.05;
  return Math.min(1, +risk.toFixed(2));
}

/* ─── Exports ─── */
async function exportFHIR(woundId){
  const w = await DB.get('wounds', woundId);
  const p = await DB.get('patients', w.patientId);
  const ass = (await DB.all('assessments','woundId',woundId)).sort((a,b)=>a.createdAt-b.createdAt);
  if(!ass.length){ toast('No assessments'); return; }
  const latest = ass[ass.length-1];
  const bundle = {resourceType:'Bundle', type:'collection', timestamp:new Date().toISOString(),
    entry:[
      {resource:{resourceType:'Patient', id:p.id, name:[{text:p.name}], identifier:p.mrn?[{value:p.mrn}]:undefined}},
      {resource:{resourceType:'Observation', id:latest.id, status:'final',
        code:{text:'Wound measurement'}, subject:{reference:'Patient/'+p.id},
        effectiveDateTime:new Date(latest.createdAt).toISOString(),
        component:[
          latest.areaCm2 != null ? {code:{text:'Area'}, valueQuantity:{value:latest.areaCm2, unit:'cm2'}} : null,
          latest.perimeterCm != null ? {code:{text:'Perimeter'}, valueQuantity:{value:latest.perimeterCm, unit:'cm'}} : null,
          latest.expectedDays != null ? {code:{text:'Expected healing days'}, valueQuantity:{value:latest.expectedDays, unit:'d'}} : null,
        ].filter(Boolean)}},
    ]};
  const blob = new Blob([JSON.stringify(bundle,null,2)],{type:'application/fhir+json'});
  downloadBlob(blob, 'yulto-fhir-'+woundId+'.json');
  toast('FHIR R4 exported');
}
async function exportCSV(woundId){
  const w = await DB.get('wounds', woundId);
  const ass = (await DB.all('assessments','woundId',woundId)).sort((a,b)=>a.createdAt-b.createdAt);
  if(!ass.length){ toast('No assessments'); return; }
  const headers = ['Date','Area cm2','Perimeter cm','Circularity','Edge irregularity','Infection','HealingIndex','Pain','Exudate','Odor','Periwound','Dressing','Debridement','Expected days','Notes'];
  const rows = ass.map(a => [
    new Date(a.createdAt).toISOString(),
    a.areaCm2 ?? '', a.perimeterCm ?? '', a.circularity ?? '', a.edgeIrregularity ?? '',
    a.infection ?? '', a.healingIndex ?? '',
    a.pain ?? '', a.exudate ?? '', a.odor ?? '', a.periwound ?? '',
    (a.dressings || '').replace(/,/g,';'), (a.debridement || '').replace(/,/g,';'),
    a.expectedDays ?? '', (a.notes || '').replace(/,/g,';')
  ]);
  const csv = [headers.join(','), ...rows.map(r=>r.join(','))].join('\n');
  const blob = new Blob([csv], {type:'text/csv'});
  downloadBlob(blob, 'yulto-'+w.label.replace(/[^a-z0-9]/gi,'_')+'.csv');
  toast('CSV exported');
}
function downloadBlob(blob, filename){
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = filename; document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 2000);
}

async function exportWoundPDF(woundId){
  const w = await DB.get('wounds', woundId);
  const p = await DB.get('patients', w.patientId);
  const imgs = (await DB.all('images','woundId',woundId)).sort((a,b)=>a.createdAt-b.createdAt);
  const ass = (await DB.all('assessments','woundId',woundId)).sort((a,b)=>a.createdAt-b.createdAt);
  if(!ass.length){ toast('No assessments'); return; }
  toast('Generating PDF…', 4000);
  const {jsPDF} = window.jspdf;
  const doc = new jsPDF({unit:'mm', format:'a4'});
  const PW = 210, PH = 297, M = 15;
  let y = M;
  doc.setFontSize(20); doc.setTextColor(37,99,235);
  doc.text('YULTO CARE', M, y); y += 7;
  doc.setFontSize(10); doc.setTextColor(100);
  doc.text('Clinical wound assessment report', M, y); y += 8;
  doc.setDrawColor(226,232,240); doc.line(M, y, PW-M, y); y += 6;
  doc.setFontSize(11); doc.setTextColor(15,23,42);
  doc.text('Patient: '+(p?.name||'—'), M, y); y += 5;
  doc.text('MRN: '+(p?.mrn||'—'), M, y); y += 5;
  doc.text('Wound: '+w.label+' • '+w.type+' • '+(w.location||''), M, y); y += 5;
  doc.text('Report date: '+new Date().toLocaleString(), M, y); y += 5;
  y += 4;
  const latest = ass[ass.length-1];
  doc.setFontSize(13); doc.setTextColor(37,99,235);
  doc.text('Latest assessment', M, y); y += 6;
  doc.setFontSize(10); doc.setTextColor(15,23,42);
  const rows = [
    ['Area', latest.areaCm2 ? latest.areaCm2+' cm²' : '—'],
    ['Perimeter', latest.perimeterCm ? latest.perimeterCm+' cm' : '—'],
    ['Circularity', latest.circularity ? (latest.circularity*100).toFixed(0)+'%' : '—'],
    ['Infection risk', (latest.infection*100).toFixed(0)+'%'],
    ['HealingIndex', latest.healingIndex != null ? (latest.healingIndex*100).toFixed(0)+'%' : '—'],
    ['Expected healing', latest.expectedDays ? latest.expectedDays+' days' : '—'],
    ['Range', (latest.optimisticDays && latest.pessimisticDays) ? latest.optimisticDays+'–'+latest.pessimisticDays+' days' : '—'],
    ['Pain', latest.pain != null ? latest.pain+'/10' : '—'],
    ['Exudate', latest.exudate || '—'],
    ['Dressing', latest.dressings || '—'],
  ];
  for(const [k,v] of rows){ doc.text(k+':', M, y); doc.text(String(v), M+50, y); y += 5; }
  if(latest.tissue){
    doc.text('Tissue composition:', M, y); y += 5;
    for(const [k,v] of Object.entries(latest.tissue)){
      if(v > 0){ doc.text('  • '+k+': '+v+'%', M, y); y += 5; }
    }
  }
  y += 4;
  if(imgs.length){
    doc.setFontSize(13); doc.setTextColor(37,99,235);
    doc.text('Photo history', M, y); y += 6;
    const thumbW = 40, thumbH = 40, gap = 4;
    let x = M;
    for(const img of imgs.slice(-8)){
      if(y+thumbH > PH-M){ doc.addPage(); y = M; x = M; }
      const dataUrl = img.dataUrl || (img.blob ? await blobToDataURL(img.blob) : null);
      if(!dataUrl) continue;
      try{
        doc.addImage(dataUrl, 'JPEG', x, y, thumbW, thumbH);
        doc.setFontSize(7); doc.setTextColor(100);
        doc.text(fmtDate(img.createdAt), x, y+thumbH+3);
      }catch(e){}
      x += thumbW+gap;
      if(x+thumbW > PW-M){ x = M; y += thumbH+8; }
    }
    y += thumbH+10;
  }
  const totalPages = doc.getNumberOfPages();
  for(let i = 1; i <= totalPages; i++){
    doc.setPage(i);
    doc.setFontSize(7); doc.setTextColor(150);
    doc.text('Generated by YULTO CARE • For clinical reference only', M, PH-8);
    doc.text('Page '+i+'/'+totalPages, PW-M-15, PH-8);
  }
  doc.save('yulto-'+(p?.name||'patient').replace(/[^a-z0-9]/gi,'_')+'.pdf');
  toast('PDF saved');
}
function blobToDataURL(blob){return new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(blob)})}

function printHandout(){
  toast('Use your browser/phone print option to save as PDF', 3000);
  setTimeout(()=>window.print(), 300);
}
async function shareHandout(patientName, woundType){
  const content = HANDOUT_CONTENT[woundType] || HANDOUT_CONTENT.other;
  const text = `${content.title}\n\n${content.intro}\n\nWHAT TO DO:\n${content.do.map(d=>'• '+d).join('\n')}\n\nWHAT TO AVOID:\n${content.dont.map(d=>'• '+d).join('\n')}\n\nWARNING SIGNS:\n${content.warn.map(d=>'• '+d).join('\n')}\n\n— YULTO CARE`;
  if(state.native && window.yultoDB.shareText){
    await window.yultoDB.shareText({title:'Patient handout', text});
  } else if(navigator.share){
    await navigator.share({title:'Patient handout', text});
  } else {
    await navigator.clipboard.writeText(text); toast('Copied to clipboard');
  }
}

/* ─── Settings ─── */
async function renderSettings(v){
  const stats = {p:(await DB.all('patients')).length, w:(await DB.all('wounds')).length, i:(await DB.all('images')).length, a:(await DB.all('assessments')).length};
  const markerSize = (await DB.get('settings','marker_mm'))?.v || 20;
  const clinician = (await DB.get('settings','clinician'))?.v || '';
  const backups = (await DB.all('backups')).sort((a,b)=>b.ts-a.ts).slice(0,5);
  const darkMode = (await DB.get('settings','dark'))?.v || false;
  v.innerHTML = `
    <h1 class="title">Settings</h1>
    <p class="sub">${state.native ? 'Native SQLite' : 'Browser IndexedDB'} · ${stats.p} patients · ${stats.i} photos</p>
    <div class="card">
      <b>Automatic backups</b>
      <div class="muted" style="font-size:12px;margin-top:4px">A backup file is offered for saving every 3 days when you open the app. Last: ${state.lastBackupAt ? timeAgo(state.lastBackupAt) : 'never'}.</div>
      <div style="height:10px"></div>
      <button class="btn ok" onclick="runBackup('manual-settings').then(()=>render())">Backup now</button>
      ${backups.length ? `
        <div class="muted" style="font-size:11px;font-weight:600;margin-top:14px">RECENT</div>
        ${backups.map(b=>`<div style="font-size:12px;padding:6px 0;border-bottom:1px solid var(--line)">
          <div class="row between"><span>${new Date(b.ts).toLocaleString()}</span><span class="muted">${b.reason}</span></div>
        </div>`).join('')}` : ''}
    </div>
    <div class="card">
      <b>Clinician name</b>
      <input id="clinician" value="${esc(clinician)}" placeholder="Dr. Your Name">
      <div style="height:8px"></div>
      <button class="btn sec" onclick="saveClinician()">Save</button>
    </div>
    <div class="card">
      <b>Calibration marker size (mm)</b>
      <input id="marker_mm" type="number" value="${markerSize}" step="1" min="5">
      <div style="height:8px"></div>
      <button class="btn sec" onclick="saveMarkerSize()">Save</button>
    </div>
    <div class="card">
      <b>Change PIN</b>
      <input id="newpin" type="password" inputmode="numeric" placeholder="New 4-6 digit PIN" maxlength="6">
      <div style="height:8px"></div>
      <button class="btn sec" onclick="changePin()">Update PIN</button>
    </div>
    <div class="card">
      <b>Read aloud settings</b>
      <div class="muted" style="font-size:12px;margin-top:4px">Test voice: <button class="btn sec sm" onclick="speak('YULTO CARE voice test. Everything is working.')">🔊 Test</button></div>
    </div>
    ${state.native ? `
    <div class="card"><b>Restore from backup file</b>
      <p class="muted" style="margin:4px 0 10px">Pick a JSON backup to restore everything.</p>
      <input id="restoreFile" type="file" accept=".json" onchange="restoreFromFile(this)">
    </div>` : ''}
    <div class="card">
      <b>About</b>
      <p class="muted" style="margin:4px 0 0">YULTO CARE v6.0 · ${state.native ? 'Native Android build' : 'Web build'} · All data stored on device · Auto-backup every 3 days · Voice read-aloud · Tissue heatmaps.</p>
    </div>
    <button class="btn danger" onclick="wipeAll()" style="margin-top:8px">Delete all data</button>`;
}
async function saveMarkerSize(){ await DB.put('settings',{k:'marker_mm', v: parseFloat($('#marker_mm').value)||20}); toast('Saved'); }
async function saveClinician(){ await DB.put('settings',{k:'clinician', v: $('#clinician').value.trim()}); toast('Saved'); }
async function changePin(){
  const p = $('#newpin').value.trim();
  if(p.length < 4){ toast('PIN must be ≥4 digits'); return; }
  await DB.put('settings',{k:'pin', v:p});
  $('#newpin').value = ''; toast('PIN updated');
}
async function restoreFromFile(input){
  const f = input.files[0]; if(!f) return;
  if(!confirm('Restoring will REPLACE all current data. Continue?')) return;
  try{
    const text = await f.text();
    if(state.native){ await window.yultoDB.importFromFileJson(text); }
    else {
      const data = JSON.parse(text);
      await DB.clearAll();
      for(const p of data.patients||[]) await DB.put('patients', p);
      for(const w of data.wounds||[]) await DB.put('wounds', w);
      for(const a of data.assessments||[]) await DB.put('assessments', a);
      for(const i of data.images||[]){ i.blob = base64ToBlob(i.blob); await DB.put('images', i); }
    }
    toast('Restore successful'); go('home');
  }catch(e){ toast('Restore failed: '+e.message, 3500); }
}
async function wipeAll(){
  if(!confirm('Delete ALL data permanently?')) return;
  if(!confirm('Really? This cannot be undone. Did you back up first?')) return;
  await DB.clearAll();
  await DB.put('settings',{k:'last_backup_ts', v:0});
  state.lastBackupAt = 0;
  toast('All data deleted'); go('home');
}

/* ─── Modal ─── */
function openModal(html, noClose){
  $('#modalSheet').innerHTML = (noClose ? '' : `<button class="close" onclick="closeModal()"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>`) + html;
  $('#modal').classList.remove('hidden');
}
function closeModal(){ $('#modal').classList.add('hidden'); }
$('#modal')?.addEventListener('click', e => { if(e.target.id === 'modal') closeModal(); });
function viewImage(id){
  DB.get('images', id).then(img => {
    if(!img) return;
    openModal(`<img src="${imgSrc(img)}" style="width:100%;border-radius:12px"><p class="muted" style="text-align:center;margin-top:8px">${fmtDate(img.createdAt)}</p>`);
  });
}
async function openPatient(id){ state.currentPatient = await DB.get('patients', id); go('patient'); }
async function openWound(id){ state.currentWound = await DB.get('wounds', id); go('wound'); }

/* ─── Boot ─── */
(async function boot(){
  const readyStart = Date.now();
  while(!window.YULTO_READY && Date.now() - readyStart < 5000){
    await new Promise(r => setTimeout(r, 50));
  }
  if(window.YULTO_READY && window.yultoDB){
    state.native = true;
    try{ await window.yultoDB.openDB(); }
    catch(e){ state.native = false; }
  }
  if(!state.native){
    try{ await openBrowserDB(); } catch(e){}
  }
  try{
    const pinRec = await DB.get('settings','pin');
    if(!pinRec) await DB.put('settings',{k:'pin', v:'0000'});
    const lb = await DB.get('settings','last_backup_ts');
    state.lastBackupAt = lb?.v || 0;
    const fa = await DB.get('settings','failed_attempts');
    state.failedAttempts = fa?.v || 0;
  }catch(e){}
  let inSession = false;
  try{ inSession = !!sessionStorage.getItem('yulto-in'); }catch(e){}
  if(inSession){
    $('#login').classList.add('hidden');
    $('#app').classList.remove('hidden');
    go('home');
    maybeAutoBackup();
  }
  loadAI().catch(e => console.warn('AI load failed', e));
})();
</script>
