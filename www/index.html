<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#2563eb">
<title>YULTO CARE</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%232563eb' stroke-width='2'%3E%3Crect x='4' y='4' width='16' height='16' rx='8' transform='rotate(45 12 12)'/%3E%3Ccircle cx='9' cy='9' r='.8' fill='%232563eb'/%3E%3Ccircle cx='12' cy='12' r='.8' fill='%232563eb'/%3E%3Ccircle cx='15' cy='15' r='.8' fill='%232563eb'/%3E%3C/svg%3E">
<style>
:root{--brand:#2563eb;--brand-2:#1d4ed8;--bg:#f1f5f9;--card:#fff;--text:#0f172a;--muted:#64748b;--line:#e2e8f0;--ok:#10b981;--warn:#f59e0b;--danger:#dc2626;--radius:14px;--shadow:0 1px 3px rgba(0,0,0,.08)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.5;overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
input,textarea,select{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:10px;background:#fff;outline:none;font-size:16px}
input:focus,textarea:focus,select:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(37,99,235,.12)}
textarea{resize:vertical;min-height:70px}.hidden{display:none!important}
#app{display:flex;flex-direction:column;min-height:100dvh;max-width:720px;margin:0 auto;background:var(--bg)}
header{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;display:flex;align-items:center;justify-content:space-between}
.logo{font-weight:800;font-size:18px;color:var(--brand);letter-spacing:-.3px;display:flex;align-items:center;gap:8px}
.logo svg{width:26px;height:26px}
.logo span{color:var(--text)}
main{flex:1;padding:16px;padding-bottom:calc(90px + env(safe-area-inset-bottom))}
nav{position:fixed;bottom:0;left:0;right:0;z-index:30;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 0 calc(6px + env(safe-area-inset-bottom));max-width:720px;margin:0 auto}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:11px;font-weight:600;color:var(--muted);transition:.15s}
nav button.active{color:var(--brand)}nav button svg{width:22px;height:22px}
.card{background:var(--card);border-radius:var(--radius);padding:14px;margin-bottom:10px;box-shadow:var(--shadow);border:1px solid var(--line)}
.card.link{transition:.15s;cursor:pointer}.card.link:active{transform:scale(.99);border-color:var(--brand)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:12px 18px;background:var(--brand);color:#fff;border-radius:10px;font-weight:600;font-size:15px;transition:.15s;width:100%}
.btn:active{transform:scale(.98);background:var(--brand-2)}.btn.sec{background:#fff;color:var(--text);border:1px solid var(--line)}
.btn.ok{background:var(--ok)}.btn.warn{background:var(--warn)}.btn.danger{background:var(--danger)}.btn.sm{padding:8px 12px;font-size:13px;width:auto}
.btn.yulto{background:linear-gradient(135deg,#2563eb,#06b6d4)}
.row{display:flex;gap:8px;align-items:center}.row.between{justify-content:space-between}.row.wrap{flex-wrap:wrap}
.muted{color:var(--muted);font-size:13px}.title{font-size:20px;font-weight:700;margin:0 0 4px}.sub{font-size:13px;color:var(--muted);margin:0 0 14px}
.label{display:block;font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin:12px 0 4px}
.empty{text-align:center;padding:40px 20px;color:var(--muted)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{background:#fff;padding:12px;border-radius:12px;border:1px solid var(--line)}
.stat .l{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.3px}
.stat .v{font-size:22px;font-weight:700;margin-top:4px}
.tbar{display:flex;height:14px;border-radius:999px;overflow:hidden;margin-top:6px;background:#f1f5f9}
.tlegend{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px;font-size:11px;color:var(--muted)}
.tlegend span{display:flex;align-items:center;gap:4px}.tdot{width:8px;height:8px;border-radius:50%}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}.grid3 img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;background:#f1f5f9}
.modal{position:fixed;inset:0;z-index:50;background:rgba(15,23,42,.5);display:flex;align-items:flex-end;justify-content:center}
@media(min-width:600px){.modal{align-items:center;padding:20px}}
.modal .sheet{background:#fff;border-radius:20px 20px 0 0;width:100%;max-width:520px;max-height:92vh;overflow-y:auto;padding:20px 20px calc(20px + env(safe-area-inset-bottom));position:relative}
@media(min-width:600px){.modal .sheet{border-radius:20px;padding-bottom:20px}}
.sheet h2{margin:0 0 4px;font-size:19px}.sheet .close{position:absolute;top:14px;right:14px;padding:6px;color:var(--muted)}
#chart{width:100%;height:180px;background:#f8fafc;border-radius:10px}
@keyframes spin{to{transform:rotate(360deg)}}.analyzing{padding:20px;text-align:center;color:var(--muted)}
.analyzing .spinner{width:44px;height:44px;border:4px solid var(--line);border-top-color:var(--brand);border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 12px}
#toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#0f172a;color:#fff;padding:10px 18px;border-radius:999px;font-size:13px;font-weight:500;z-index:200;opacity:0;transition:.3s;pointer-events:none;white-space:nowrap;max-width:90vw;overflow:hidden;text-overflow:ellipsis}
#toast.show{opacity:1;transform:translateX(-50%) translateY(-8px)}
#login{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px;background:linear-gradient(135deg,#eff6ff,#dbeafe)}
#login .box{background:#fff;border-radius:22px;padding:32px 24px;width:100%;max-width:380px;box-shadow:0 12px 40px rgba(37,99,235,.15)}
#login h1{font-size:26px;margin:0 0 6px;color:var(--brand);text-align:center;letter-spacing:-.5px}
#login h1 span{color:var(--text)}
#login p{text-align:center;color:var(--muted);margin:0 0 22px;font-size:14px}
.badge{display:inline-block;padding:3px 8px;border-radius:999px;font-size:11px;font-weight:600;background:#f1f5f9;color:var(--muted)}
.badge.active{background:#dbeafe;color:var(--brand-2)}.badge.healed{background:#dcfce7;color:#059669}
.badge.infected{background:#fee2e2;color:#dc2626}.badge.stalled{background:#fef3c7;color:#d97706}
.alert-flag{padding:10px 12px;border-radius:10px;font-size:13px;font-weight:600;margin-bottom:10px;text-align:center}
.alert-flag.improving{background:#dcfce7;color:#166534;border:1px solid #86efac}
.alert-flag.stalled{background:#fef3c7;color:#92400e;border:1px solid #fde68a}
.alert-flag.deteriorating{background:#fee2e2;color:#991b1b;border:1px solid #fca5a5}
.alert-flag.new{background:#dbeafe;color:#1e40af;border:1px solid #93c5fd}
.heal-badge{display:flex;align-items:center;gap:10px;background:linear-gradient(135deg,#eff6ff,#dbeafe);padding:14px;border-radius:12px;border:1px solid #bfdbfe}
.heal-badge .big{font-size:32px;font-weight:800;color:var(--brand-2);line-height:1}
.heal-badge .unit{font-size:14px;color:var(--brand-2);font-weight:600}
.heal-badge .rng{font-size:12px;color:var(--muted);margin-top:2px}
.ai-card{padding:12px;border-radius:12px;margin-bottom:14px;border:1px solid var(--line);background:#fff}
.ai-card .lbl{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.4px}
.ai-card .st{font-size:13px;color:var(--text);font-weight:600;margin-top:2px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.chip{padding:5px 10px;border-radius:999px;background:#f1f5f9;font-size:12px;font-weight:600;border:1px solid var(--line)}
.pie-legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px;font-size:12px}
.compare-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.compare-grid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px}
.compare-label{text-align:center;font-size:11px;color:var(--muted);margin-top:4px}
.slider-row{display:flex;align-items:center;gap:10px;margin-top:6px}
.slider-row input[type=range]{flex:1}
.timeline{position:relative;padding-left:22px}
.timeline::before{content:'';position:absolute;left:6px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tl-item{position:relative;padding:8px 0}
.tl-item::before{content:'';position:absolute;left:-19px;top:14px;width:12px;height:12px;border-radius:50%;background:var(--brand);border:2px solid #fff;box-shadow:0 0 0 2px var(--brand)}
.tl-date{font-size:11px;color:var(--muted);font-weight:600}
.tl-body{font-size:13px;margin-top:2px}
.progress-ring{position:relative;width:120px;height:120px;margin:0 auto}
.progress-ring svg{transform:rotate(-90deg)}
.progress-ring .pct{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.progress-ring .pct .n{font-size:26px;font-weight:800;color:var(--brand-2);line-height:1}
.progress-ring .pct .l{font-size:10px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin-top:2px}
.heatmap-tabs{display:flex;gap:6px;margin-bottom:10px}
.heatmap-tabs button{flex:1;padding:8px;border-radius:8px;background:#f1f5f9;font-size:12px;font-weight:600;border:1px solid var(--line)}
.heatmap-tabs button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.overflow-menu{position:absolute;top:48px;right:16px;background:#fff;border-radius:12px;box-shadow:0 8px 30px rgba(0,0,0,.15);border:1px solid var(--line);padding:6px;z-index:40;min-width:210px;animation:fadeIn .15s ease}
.overflow-menu button{display:block;width:100%;text-align:left;padding:12px 14px;border-radius:8px;font-size:14px;font-weight:500;color:var(--text)}
.overflow-menu button:active{background:#f1f5f9}
@keyframes fadeIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}

/* splash */
#splash{position:fixed;inset:0;z-index:9999;background:linear-gradient(135deg,#e0f2fe 0%,#dcfce7 45%,#dbeafe 100%);background-size:300% 300%;animation:gradientShift 8s ease infinite;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .9s ease,visibility .9s ease;overflow:hidden}
#splash.hide{opacity:0;visibility:hidden;pointer-events:none}
@keyframes gradientShift{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
.splash-pulse{position:absolute;border-radius:50%;border:2px solid rgba(37,99,235,.35);animation:pulseRing 3.2s ease-out infinite;pointer-events:none}
.splash-pulse.d1{animation-delay:0s}
.splash-pulse.d2{animation-delay:1.05s}
.splash-pulse.d3{animation-delay:2.1s}
@keyframes pulseRing{0%{width:80px;height:80px;opacity:.75}100%{width:520px;height:520px;opacity:0}}
.splash-icon{position:relative;z-index:2;width:88px;height:88px;border-radius:50%;background:linear-gradient(135deg,#2563eb,#06b6d4);display:flex;align-items:center;justify-content:center;box-shadow:0 10px 40px rgba(37,99,235,.3);animation:heartBeat 2.2s ease-in-out infinite,floatIn 1s ease-out}
.splash-icon svg{width:48px;height:48px;color:#fff}
@keyframes heartBeat{0%,100%{transform:scale(1)}15%{transform:scale(1.12)}30%{transform:scale(1)}45%{transform:scale(1.08)}60%{transform:scale(1)}}
@keyframes floatIn{from{opacity:0;transform:translateY(-12px)}to{opacity:1;transform:translateY(0)}}
.splash-logo{margin-top:24px;font-size:26px;font-weight:800;letter-spacing:1px;color:var(--text);opacity:0;animation:fadeUp 1s ease-out .5s forwards;z-index:2}
.splash-logo .brand{color:var(--brand)}
.splash-sub{margin-top:4px;font-size:11px;letter-spacing:2.5px;color:var(--muted);font-weight:600;text-transform:uppercase;opacity:0;animation:fadeUp 1s ease-out .9s forwards;z-index:2}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}

/* Yulto */
#yulto{position:fixed;inset:0;z-index:60;background:#f1f5f9;display:flex;flex-direction:column}
#yulto .yheader{background:linear-gradient(135deg,#2563eb,#06b6d4);color:#fff;padding:calc(env(safe-area-inset-top) + 12px) 16px 14px;display:flex;align-items:center;gap:10px}
#yulto .yheader .avatar{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:22px}
#yulto .yheader .yinfo{flex:1}
#yulto .yheader .yname{font-weight:800;font-size:16px;letter-spacing:-.3px}
#yulto .yheader .ystatus{font-size:11px;opacity:.9}
#yulto .yheader .yclose{padding:8px;color:#fff}
#yulto .yfeed{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.ymsg{max-width:85%;padding:12px 14px;border-radius:16px;font-size:14px;line-height:1.5;word-wrap:break-word;white-space:pre-wrap}
.ymsg.user{align-self:flex-end;background:var(--brand);color:#fff;border-bottom-right-radius:4px}
.ymsg.ai{align-self:flex-start;background:#fff;color:var(--text);border:1px solid var(--line);border-bottom-left-radius:4px}
.ymsg img{max-width:100%;border-radius:8px;margin-top:6px}
.yinputbar{padding:12px 12px calc(12px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid var(--line);display:flex;gap:8px;align-items:flex-end}
.yinputbar textarea{flex:1;padding:10px 12px;min-height:44px;max-height:120px;font-size:15px;resize:none;border-radius:22px;border:1px solid var(--line)}
.yinputbar .yicon{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;transition:.15s}
.yinputbar .yicon:active{transform:scale(.92)}
.yinputbar .mic{background:#eff6ff;color:var(--brand)}
.yinputbar .cam{background:linear-gradient(135deg,#2563eb,#06b6d4);color:#fff}
.yinputbar .send{background:var(--brand);color:#fff}
.yinputbar .mic.active{background:var(--danger);color:#fff}
.ychips{display:flex;gap:6px;overflow-x:auto;padding:8px 16px;background:#fff;border-top:1px solid var(--line);scrollbar-width:none}
.ychips::-webkit-scrollbar{display:none}
.ychips button{flex-shrink:0;padding:6px 12px;border-radius:999px;background:#eff6ff;color:var(--brand-2);font-size:12px;font-weight:600;border:1px solid #bfdbfe;white-space:nowrap}
.ychips button:active{background:#dbeafe}

.audit-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
.audit-row .action{font-weight:600}
.audit-row .when{color:var(--muted);font-size:11px}
</style>
</head>
<body>

<div id="splash">
  <div class="splash-pulse d1"></div>
  <div class="splash-pulse d2"></div>
  <div class="splash-pulse d3"></div>
  <div class="splash-icon">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <rect x="4" y="4" width="16" height="16" rx="8" transform="rotate(45 12 12)"/>
      <circle cx="9" cy="9" r="1" fill="currentColor"/>
      <circle cx="12" cy="12" r="1" fill="currentColor"/>
      <circle cx="15" cy="15" r="1" fill="currentColor"/>
    </svg>
  </div>
  <div class="splash-logo">YULTO <span class="brand">CARE</span></div>
  <div class="splash-sub">Clinical Wound Platform</div>
</div>

<div id="login" class="hidden">
  <div class="box">
    <h1>YULTO<span>CARE</span></h1>
    <p>Clinician access</p>
    <label class="label">PIN</label>
    <input id="pin" type="password" inputmode="numeric" placeholder="Enter your PIN" autocomplete="off">
    <div style="height:16px"></div>
    <button class="btn" onclick="doLogin()">Unlock</button>
    <div style="height:12px"></div>
    <p class="muted" style="text-align:center;font-size:12px">First time? PIN is <b>0000</b>. Change in Settings.</p>
    <div id="ai-status" style="text-align:center;font-size:11px;color:var(--muted);margin-top:12px">Loading…</div>
  </div>
</div>

<div id="app" class="hidden">
  <header>
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="2">
        <rect x="4" y="4" width="16" height="16" rx="8" transform="rotate(45 12 12)"/>
        <circle cx="9" cy="9" r="1" fill="#2563eb"/>
        <circle cx="12" cy="12" r="1" fill="#2563eb"/>
        <circle cx="15" cy="15" r="1" fill="#2563eb"/>
      </svg>
      YULTO<span>CARE</span>
    </div>
    <div class="row" style="gap:4px">
      <button onclick="openYulto()" style="padding:6px;color:var(--brand)" title="Ask Yulto">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 12v-2a3 3 0 0 1 3-3h2"/><circle cx="18" cy="8" r="3"/><path d="M18 11v4a5 5 0 0 1-5 5h-2"/><circle cx="9" cy="20" r="1.5" fill="currentColor"/></svg>
      </button>
      <button onclick="go('settings')" style="padding:6px;color:var(--muted)">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h0a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h0a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v0a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
    </div>
  </header>
  <main id="view"></main>
  <nav id="nav">
    <button data-tab="home" onclick="go('home')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg><span>Home</span></button>
    <button data-tab="patients" onclick="go('patients')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="23" y1="11" x2="17" y2="11"/></svg><span>Patients</span></button>
    <button data-tab="capture" onclick="go('capture')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3z"/><circle cx="12" cy="13" r="3"/></svg><span>Capture</span></button>
    <button data-tab="settings" onclick="go('settings')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/></svg><span>Settings</span></button>
  </nav>
</div>

<div id="yulto" class="hidden">
  <div class="yheader">
    <div class="avatar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="24" height="24">
        <rect x="4" y="4" width="16" height="16" rx="8" transform="rotate(45 12 12)"/>
        <circle cx="12" cy="12" r="1" fill="currentColor"/>
      </svg>
    </div>
    <div class="yinfo">
      <div class="yname">Yulto</div>
      <div class="ystatus" id="yultoStatus">AI clinical assistant · online</div>
    </div>
    <button class="yclose" onclick="closeYulto()">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
  </div>
  <div class="yfeed" id="yultoFeed"></div>
  <div class="ychips" id="yultoChips"></div>
  <div class="yinputbar">
    <button class="yicon mic" id="yultoMic" onclick="toggleYultoMic()" title="Voice input">🎤</button>
    <textarea id="yultoInput" placeholder="Ask Yulto about wound care…" rows="1" oninput="autoGrow(this)" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendYultoMessage()}"></textarea>
    <button class="yicon cam" onclick="yultoCamera()" title="Analyze photo">📷</button>
    <button class="yicon send" onclick="sendYultoMessage()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
    </button>
  </div>
</div>

<div id="modal" class="modal hidden"><div class="sheet" id="modalSheet"></div></div>
<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.20.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"></script>
<script src="capacitor.js" type="module"></script>

<script>
/* YULTO CARE v8.0 */
const YULTO_WORKER_URL = 'https://yulto-ai.kathikabalasooriya.workers.dev/';
  const YULTO_MODEL = 'gemini-3.8-flash';
const BACKUP_INTERVAL_MS = 3*24*60*60*1000;
let state = {
  screen:'home', currentPatient:null, currentWound:null,
  woundModel:null, aiReady:false, lastBackupAt:0, native:false,
  failedAttempts:0, yultoHistory: [], yultoListening: false, _clinicianName: '',
};
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const $ = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>[...r.querySelectorAll(s)];
const esc = s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtDate = d=>new Date(d).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'});
const fmtShort = d=>new Date(d).toLocaleDateString(undefined,{month:'short',day:'numeric'});
const fmtDateTime = d=>new Date(d).toLocaleString(undefined,{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});
function toast(msg,dur=2200){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),dur)}
function withTimeout(p,ms,label){return Promise.race([p,new Promise((_,rej)=>setTimeout(()=>rej(new Error((label||'op')+' timed out')),ms))])}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function blobToBase64(b){return new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(b)})}
function base64ToBlob(d){const [m,b]=d.split(',');return new Blob([Uint8Array.from(atob(b),c=>c.charCodeAt(0))],{type:m.match(/:(.*?);/)[1]})}

/* DB */
let _browserDb = null;
async function openBrowserDB(){
  return new Promise((res,rej)=>{
    const r = indexedDB.open('yultocare', 4);
    r.onupgradeneeded = e => {
      const d = e.target.result;
      if(!d.objectStoreNames.contains('patients')) d.createObjectStore('patients',{keyPath:'id'});
      if(!d.objectStoreNames.contains('wounds')){const s=d.createObjectStore('wounds',{keyPath:'id'});s.createIndex('patientId','patientId')}
      if(!d.objectStoreNames.contains('images')){const s=d.createObjectStore('images',{keyPath:'id'});s.createIndex('woundId','woundId')}
      if(!d.objectStoreNames.contains('assessments')){const s=d.createObjectStore('assessments',{keyPath:'id'});s.createIndex('woundId','woundId')}
      if(!d.objectStoreNames.contains('settings')) d.createObjectStore('settings',{keyPath:'k'});
      if(!d.objectStoreNames.contains('audit')) d.createObjectStore('audit',{keyPath:'id'});
      if(!d.objectStoreNames.contains('backups')) d.createObjectStore('backups',{keyPath:'id'});
    };
    r.onsuccess = () => { _browserDb = r.result; res(); };
    r.onerror = () => rej(r.error);
  });
}
function btx(store,mode='readonly'){return _browserDb.transaction(store,mode).objectStore(store)}
const DB = {
  async put(s,v){ if(state.native) return window.yultoDB.put(s,v);
    return new Promise((res,rej)=>{const r=btx(s,'readwrite').put(v);r.onsuccess=()=>res(v);r.onerror=()=>rej(r.error)}); },
  async get(s,k){ if(state.native) return window.yultoDB.get(s,k);
    return new Promise((res,rej)=>{const r=btx(s).get(k);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}); },
  async all(s,i,k){ if(state.native) return window.yultoDB.all(s,i,k);
    return new Promise((res,rej)=>{const st=btx(s);const r=k?st.index(i).getAll(k):st.getAll();r.onsuccess=()=>res(r.result||[]);r.onerror=()=>rej(r.error)}); },
  async del(s,k){ if(state.native) return window.yultoDB.del(s,k);
    return new Promise((res,rej)=>{const r=btx(s,'readwrite').delete(k);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)}); },
  async clearAll(){ if(state.native) return window.yultoDB.clearAll();
    for(const s of ['patients','wounds','images','assessments','audit','backups']){
      await new Promise(r=>{const t=_browserDb.transaction(s,'readwrite');t.objectStore(s).clear();t.oncomplete=r});
    } }
};
async function logAudit(a,d){ try{ await DB.put('audit',{id:uid(),action:a,details:d||{},ts:Date.now()}); }catch(e){} }

/* Backup */
async function runBackup(reason){
  try{
    if(state.native){ await window.yultoDB.shareBackup(reason||'manual'); }
    else {
      const payload = {app:'YULTO CARE', version:'8.0-web', exportedAt:new Date().toISOString(),
        patients: await DB.all('patients'), wounds: await DB.all('wounds'),
        assessments: await DB.all('assessments'),
        images: await Promise.all((await DB.all('images')).map(async i=>({...i, blob:await blobToBase64(i.blob)}))),
        audit: await DB.all('audit')};
      const blob = new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
      a.download = 'yulto-backup-'+new Date().toISOString().slice(0,10)+'.json';
      document.body.appendChild(a); a.click();
      setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},2000);
      await DB.put('settings',{k:'last_backup_ts',v:Date.now()});
    }
    state.lastBackupAt = Date.now();
    toast('Backup saved to Documents/YULTO_CARE');
  }catch(e){ toast('Backup failed: '+e.message,3500); }
}
async function maybeAutoBackup(){
  const rec = await DB.get('settings','last_backup_ts');
  state.lastBackupAt = rec?.v || 0;
  const n = (await DB.all('patients')).length;
  if(n === 0) return;
  if(Date.now() - state.lastBackupAt >= BACKUP_INTERVAL_MS) setTimeout(()=>runBackup('auto-3day'),1500);
}
function timeAgo(ts){
  const s = Math.floor((Date.now()-ts)/1000);
  if(s<60) return 'just now';
  const m = Math.floor(s/60); if(m<60) return m+'m ago';
  const h = Math.floor(m/60); if(h<24) return h+'h ago';
  return Math.floor(h/24)+'d ago';
}
function isOverdue(){ if(!state.lastBackupAt) return true; return Date.now()-state.lastBackupAt >= BACKUP_INTERVAL_MS; }

/* Voice */
async function speak(text){
  if(state.native && window.yultoDB.speak){
    try{ const r = await window.yultoDB.speak(text); if(r && r.ok) return; }catch(e){}
  }
  if('speechSynthesis' in window){
    try{
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.rate = 0.95; u.pitch = 1; u.volume = 1;
      const v = speechSynthesis.getVoices().find(x => x.lang.startsWith('en'));
      if(v) u.voice = v;
      speechSynthesis.speak(u);
      return;
    }catch(e){}
  }
  toast('Voice not available on this device');
}
function stopSpeaking(){
  if(state.native && window.yultoDB.stopSpeaking) try{ window.yultoDB.stopSpeaking(); }catch(e){}
  if('speechSynthesis' in window) try{ speechSynthesis.cancel(); }catch(e){}
}
async function startListening(onResult){
  if(state.native && window.yultoDB.startListening){
    const r = await window.yultoDB.startListening();
    if(r?.text) onResult(r.text);
    else if(r?.error) toast('Voice input error: '+r.error);
    return;
  }
  if('webkitSpeechRecognition' in window || 'SpeechRecognition' in window){
    try{
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      const rec = new SR(); rec.continuous = false; rec.interimResults = false; rec.lang = 'en-US';
      rec.onresult = e => { const t = e.results[0][0].transcript; if(t) onResult(t); };
      rec.onerror = e => toast('Voice error: '+e.error);
      rec.start();
    }catch(e){ toast('Voice not available'); }
  } else toast('Voice input not available');
}

/* Yulto AI */
function openYulto(prompt){
  $('#yulto').classList.remove('hidden');
  if(!state.yultoHistory.length){
    const c = state._clinicianName || 'Doctor';
    yultoAdd('ai', `Hi ${c}. I'm Yulto, your wound care assistant.\n\nI can analyze wound photos, help with dressing selection, interpret infection risk, and answer clinical questions.\n\nTap 📷 to analyze a photo, or just ask.`);
  }
  renderYultoFeed(); renderYultoChips();
  if(prompt) setTimeout(()=>{ $('#yultoInput').value = prompt; sendYultoMessage(); }, 200);
}
function closeYulto(){ $('#yulto').classList.add('hidden'); stopSpeaking(); }
function yultoAdd(role, text, image){ state.yultoHistory.push({role, text, image:image||null, ts:Date.now()}); }
function renderYultoFeed(){
  const feed = $('#yultoFeed');
  feed.innerHTML = state.yultoHistory.map(m => `<div class="ymsg ${m.role}">${esc(m.text)}${m.image?`<img src="${m.image}">`:''}</div>`).join('');
  feed.scrollTop = feed.scrollHeight;
}
function renderYultoChips(){
  const chips = [
    {l:'Analyze wound photo', a:()=>yultoCamera()},
    {l:'Dressing advice', a:()=>{ $('#yultoInput').value = 'What dressing should I use for a sloughy diabetic foot ulcer?'; sendYultoMessage(); }},
    {l:'Infection signs', a:()=>{ $('#yultoInput').value = 'What are the warning signs of wound infection?'; sendYultoMessage(); }},
    {l:'Offloading', a:()=>{ $('#yultoInput').value = 'What offloading options are recommended for diabetic foot ulcers?'; sendYultoMessage(); }},
  ];
  $('#yultoChips').innerHTML = chips.map((c,i)=>`<button data-chip="${i}">${c.l}</button>`).join('');
  $('#yultoChips').querySelectorAll('button').forEach((b,i)=>{ b.onclick = chips[i].a; });
}
async function sendYultoMessage(){
  const input = $('#yultoInput'); const text = input.value.trim(); if(!text) return;
  input.value = ''; autoGrow(input);
  await processYulto({ text });
}
async function yultoCamera(){
  const input = document.createElement('input');
  input.type = 'file'; input.accept = 'image/*'; input.capture = 'environment';
  input.style.display = 'none'; document.body.appendChild(input);
  input.onchange = async e => {
    const file = e.target.files?.[0]; document.body.removeChild(input);
    if(!file) return;
    const dataUrl = await blobToBase64(file);
    await processYulto({ image: dataUrl, text: 'Analyze this wound. Identify tissue types, infection signs, and recommend dressing/management.' });
  };
  input.click();
}
async function processYulto({ text, image }){
  yultoAdd('user', text, image); renderYultoFeed();
  yultoAdd('ai', 'Thinking…'); renderYultoFeed();
  $('#yultoStatus').textContent = 'Analyzing…';
  const sys = `You are Yulto, a clinical wound care AI assistant powered by Gemini 3.8 Flash. You work for a doctor's clinic. Help with wound assessment, tissue identification, dressing selection, infection risk, and general wound care. Be concise and clinically practical. When given a photo, comment on tissue type, size, infection signs, dressings, and red flags. Use short paragraphs or bullets.`;
  try{
    const res = await fetch(YULTO_WORKER_URL, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ prompt: sys + '\n\nUser: ' + text, imageBase64: image || null,
        imageMime: image ? (image.match(/data:(.*?);/)?.[1] || 'image/jpeg') : null })
    });
    const data = await res.json();
    const reply = data?.text || data?.error || 'No response';
    state.yultoHistory.pop();
    yultoAdd('ai', reply); renderYultoFeed();
    $('#yultoStatus').textContent = 'AI clinical assistant · online';
    speak(reply.slice(0, 500));
  } catch(e){
    state.yultoHistory.pop();
    yultoAdd('ai', 'Could not reach Yulto.\n\nType: ' + e.name + '\nMessage: ' + e.message + '\n\nWorker: ' + YULTO_WORKER_URL);
    renderYultoFeed(); $('#yultoStatus').textContent = 'Connection error';
  }
}
function autoGrow(el){ el.style.height = 'auto'; el.style.height = Math.min(el.scrollHeight, 120) + 'px'; }
async function toggleYultoMic(){
  const mic = $('#yultoMic');
  if(state.yultoListening){ state.yultoListening = false; mic.classList.remove('active'); return; }
  state.yultoListening = true; mic.classList.add('active');
  $('#yultoStatus').textContent = 'Listening…';
  await startListening((text)=>{
    state.yultoListening = false; mic.classList.remove('active');
    $('#yultoStatus').textContent = 'AI clinical assistant · online';
    if(text){ $('#yultoInput').value = text; sendYultoMessage(); }
  });
  setTimeout(()=>{ state.yultoListening = false; mic.classList.remove('active'); }, 8000);
}

/* Wound model */
async function loadAI(){
  try{
    const el = $('#ai-status'); if(el) el.textContent = 'Loading wound model…';
    state.woundModel = await withTimeout(
      tf.loadGraphModel('https://cdn.jsdelivr.net/gh/rootsec1/wound-detection-model@main/web-ui/public/model_files/model.json'),
      20000,'wound model');
    state.aiReady = true;
    if(el) el.textContent = 'AI ready ✓';
  }catch(e){ if(el) el.textContent = 'Color AI active'; }
}

/* Login */
async function doLogin(){
  try{
    const lockUntil = (await DB.get('settings','lock_until'))?.v || 0;
    if(lockUntil > Date.now()){
      const mins = Math.ceil((lockUntil - Date.now())/60000);
      toast('Locked for '+mins+' min', 4000); return;
    }
    const pin = $('#pin').value;
    let saved = '0000';
    try{ saved = (await DB.get('settings','pin'))?.v || '0000'; }catch(e){}
    if(pin === saved){
      state.failedAttempts = 0;
      await DB.put('settings',{k:'failed_attempts', v:0});
      try{ sessionStorage.setItem('yulto-in','1'); }catch(e){}
      $('#login').classList.add('hidden');
      $('#app').classList.remove('hidden');
      logAudit('login',{});
      maybeAutoBackup();
      if(state.native && window.yultoDB.scheduleBackupReminder) setTimeout(()=>window.yultoDB.scheduleBackupReminder(), 2000);
      go('home');
    } else {
      state.failedAttempts = (state.failedAttempts || 0) + 1;
      await DB.put('settings',{k:'failed_attempts', v:state.failedAttempts});
      if(state.failedAttempts >= 5){ await DB.put('settings',{k:'lock_until', v:Date.now() + 5*60*1000}); toast('Too many attempts. Locked 5 min.', 4000); }
      else toast('Wrong PIN ('+state.failedAttempts+'/5)');
      $('#pin').value = '';
    }
  }catch(e){ $('#login').classList.add('hidden'); $('#app').classList.remove('hidden'); go('home'); }
}
$('#pin')?.addEventListener('keydown',e=>{if(e.key==='Enter')doLogin()});

/* Router */
function go(screen,opts){
  state.screen = screen;
  if(opts?.patient) state.currentPatient = opts.patient;
  if(opts?.wound) state.currentWound = opts.wound;
  $$('#nav button').forEach(b=>b.classList.toggle('active', b.dataset.tab === screen));
  render(); window.scrollTo(0,0);
}
async function render(){
  const v = $('#view'); v.innerHTML = '';
  switch(state.screen){
    case 'home': await renderHome(v); break;
    case 'patients': await renderPatients(v); break;
    case 'patient': await renderPatient(v); break;
    case 'wound': await renderWound(v); break;
    case 'capture': await renderCapture(v); break;
    case 'settings': await renderSettings(v); break;
    case 'stats': await renderStats(v); break;
    case 'audit': await renderAudit(v); break;
    case 'scores': await renderScores(v); break;
    case 'timeline': await renderTimeline(v); break;
    case 'compare': await renderCompare(v); break;
    case 'progression': await renderProgression(v); break;
    case 'heatmap': await renderHeatmap(v); break;
    case 'handout': await renderHandout(v); break;
  }
}

/* Home — v3.1 style */
async function renderHome(v){
  const patients = await DB.all('patients');
  const wounds = await DB.all('wounds');
  const images = await DB.all('images');
  const assessments = await DB.all('assessments');
  const active = wounds.filter(w=>w.status === 'active').length;
  const clinician = state._clinicianName || '';
  const h = new Date().getHours();
  const greet = h < 12 ? 'Good morning' : h < 18 ? 'Good afternoon' : 'Good evening';
  const who = clinician ? `, Dr. ${esc(clinician)}` : ', Doctor';

  v.innerHTML = `
    <h1 class="title">${greet}${who}</h1>
    <p class="sub">Your clinic at a glance</p>

    ${isOverdue() ? `
      <div class="card" style="background:#fef3c7;border-color:#fde68a">
        <div class="row between">
          <div><b style="color:#92400e">Backup overdue</b><div class="muted" style="font-size:12px;color:#92400e">Last: ${state.lastBackupAt ? timeAgo(state.lastBackupAt) : 'never'}</div></div>
          <button class="btn warn sm" onclick="runBackup('manual-home').then(()=>render())">Backup</button>
        </div>
      </div>` : ''}

    <div class="stats" style="margin-bottom:14px">
      <div class="stat"><div class="l">Patients</div><div class="v">${patients.length}</div></div>
      <div class="stat"><div class="l">Active wounds</div><div class="v">${active}</div></div>
      <div class="stat"><div class="l">Photos</div><div class="v">${images.length}</div></div>
      <div class="stat"><div class="l">Assessments</div><div class="v">${assessments.length}</div></div>
    </div>

    <div class="row" style="gap:8px;margin-bottom:14px">
      <button class="btn" onclick="openNewPatient()">+ New Patient</button>
      <button class="btn sec" onclick="go('patients')">All Patients</button>
    </div>

    <div class="ai-card">
      <div class="row between">
        <div>
          <div class="lbl">AI engine</div>
          <div class="st">${state.aiReady ? 'Wound model ready' : 'Color-based fallback'}</div>
        </div>
        <div style="font-weight:700;color:${state.aiReady?'var(--ok)':'var(--warn)'}">${state.aiReady ? 'Ready' : 'Loading'}</div>
      </div>
    </div>

    ${assessments.length ? `
      <h2 class="title" style="font-size:16px;margin-top:22px">Recent assessments</h2>
      ${(await Promise.all(assessments.slice(-5).reverse().map(async a=>{
        const w = await DB.get('wounds',a.woundId);
        const p = w ? await DB.get('patients',w.patientId) : null;
        return `<div class="card link" onclick="openWound('${a.woundId}')">
          <div class="row between">
            <div><b>${esc(w?.label || 'Wound')}</b><div class="muted">${esc(p?.name || '')} · ${fmtDate(a.createdAt)}</div></div>
            <div style="text-align:right"><div style="font-weight:700;color:var(--brand)">${a.areaCm2 ? a.areaCm2 + ' cm²' : '—'}</div>
            <div class="muted" style="font-size:11px">${a.expectedDays ? '~'+a.expectedDays+'d' : ''}</div></div>
          </div></div>`;
      }))).join('')}` : ''}`;
}

/* Capture tab */
async function renderCapture(v){
  const wounds = (await DB.all('wounds')).filter(w => w.status !== 'healed');
  v.innerHTML = `
    <h1 class="title">Capture</h1>
    <p class="sub">Select a wound to photograph</p>
    <div class="card" style="background:#eff6ff;border-color:#bfdbfe">
      <div class="muted" style="font-size:12px">📏 Place a <b>20 mm ArUco marker</b> next to the wound for accurate cm².</div>
    </div>
    ${wounds.length ? (await Promise.all(wounds.map(async w => {
      const p = await DB.get('patients', w.patientId);

        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--brand)" stroke-width="2"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3z"/><circle cx="12" cy="13" r="3"/></svg></div></div>`;
    }))).join('') : `<div class="empty"><p>No active wounds</p><button class="btn sm" onclick="go('patients')">Go to patients</button></div>`}`;
}
function captureWound(woundId){ captureWithNativeCamera(woundId); }

/* Patients */
async function renderPatients(v){
  const patients = (await DB.all('patients')).sort((a,b)=>b.createdAt-a.createdAt);
  v.innerHTML = `
    <div class="row between" style="margin-bottom:12px"><h1 class="title" style="margin:0">Patients</h1><button class="btn sm" onclick="openNewPatient()">+ Add</button></div>
    <input id="psearch" placeholder="Search by name or MRN…" oninput="filterPatients()" style="margin-bottom:12px">
    <div id="plist">${patients.length ? patients.map(patientRow).join('') : '<div class="empty"><p>No patients yet</p><button class="btn sm" onclick="openNewPatient()">Add your first patient</button></div>'}</div>`;
}
function patientRow(p){
  const tags = [p.diabetes && 'DM', p.pvd && 'PVD', p.smoker && 'Smoker'].filter(Boolean);
  return `<div class="card link" onclick="openPatient('${p.id}')">
    <div class="row between"><div><b>${esc(p.name)}</b><div class="muted">${esc(p.mrn || '—')}${tags.length ? ' · '+tags.join(' · ') : ''}</div></div>
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--muted)" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg></div></div>`;
}
function filterPatients(){
  const q = $('#psearch').value.toLowerCase();
  DB.all('patients').then(ps=>{
    const f = ps.filter(p=>p.name.toLowerCase().includes(q) || (p.mrn||'').toLowerCase().includes(q));
    $('#plist').innerHTML = f.length ? f.map(patientRow).join('') : '<div class="empty">No matches</div>';
  });
}

/* Patient detail */
async function renderPatient(v){
  const p = state.currentPatient; if(!p) return go('patients');
  const wounds = (await DB.all('wounds','patientId',p.id)).sort((a,b)=>b.createdAt-a.createdAt);
  v.innerHTML = `
    <div class="row between" style="margin-bottom:8px">

function assessmentFlags(ass){
  if(ass.length < 2) return {cls:'new', icon:'🆕', label:'New wound — baseline recorded'};
  const a1 = ass[ass.length-2], a2 = ass[ass.length-1];
  if(!a1.areaCm2 || !a2.areaCm2) return null;
  const change = (a2.areaCm2 - a1.areaCm2) / a1.areaCm2;
  const days = (a2.createdAt - a1.createdAt)/(24*60*60*1000);
  if(change < -0.1) return {cls:'improving', icon:'✓', label:'Improving ('+(change*100).toFixed(0)+'% area)'};
  if(change > 0.1) return {cls:'deteriorating', icon:'⚠', label:'Deteriorating (+'+(change*100).toFixed(0)+'% area)'};
  if(days > 14 && Math.abs(change) < 0.05) return {cls:'stalled', icon:'⏸', label:'Stalled '+Math.round(days)+' days'};
  return {cls:'new', icon:'•', label:'Stable'};
}
function computeRiskStratification(latest, patient){
  if(!latest) return {level:'low', label:'Low'};
  let score = 0;
  if(latest.areaCm2 > 4) score += 2; else if(latest.areaCm2 > 2) score += 1;
  if((latest.tissue?.necrosis || 0) > 20) score += 2;
  if(latest.infection > 0.6) score += 2; else if(latest.infection > 0.3) score += 1;
  if(patient?.diabetes) score += 1;
  if(patient?.pvd) score += 2;
  if(score >= 4) return {level:'high', label:'High'};
  if(score >= 2) return {level:'medium', label:'Medium'};
  return {level:'low', label:'Low'};
}
function imgSrc(rec){ if(rec.dataUrl) return rec.dataUrl; if(rec.blob) return URL.createObjectURL(rec.blob); return ''; }
function calcPAR(ass){
  const w = ass.filter(a=>a.areaCm2);
  if(w.length < 2) return null;
  const f = w[0].areaCm2, l = w[w.length-1].areaCm2;
  if(!f) return null;
  return ((f-l)/f)*100;
}
function drawChart(ass){
  const c = $('#chart'); if(!c) return;
  const dpr = window.devicePixelRatio || 1;
  const w = c.clientWidth, h = 180;
  c.width = w*dpr; c.height = h*dpr;
  const ctx = c.getContext('2d'); ctx.scale(dpr,dpr);
  const data = ass.filter(a=>a.areaCm2).map(a=>({x:a.createdAt, y:a.areaCm2}));
  if(data.length < 2) return;
  const pad = 34;
  const xs = data.map(d=>d.x), ys = data.map(d=>d.y);
  const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = 0, y1 = Math.max(...ys)*1.15;
  const px = x => pad + (x-x0)/(x1-x0||1)*(w-pad*2);
  const py = y => h-pad - (y-y0)/(y1-y0||1)*(h-pad*2);
  ctx.strokeStyle='#e2e8f0'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(pad,h-pad); ctx.lineTo(w-pad,h-pad); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(pad,pad); ctx.lineTo(pad,h-pad); ctx.stroke();
  ctx.fillStyle='#94a3b8'; ctx.font='10px sans-serif';
  ctx.fillText(y1.toFixed(1)+' cm²', 4, pad-6); ctx.fillText('0', 4, h-pad);
  ctx.strokeStyle='#2563eb'; ctx.lineWidth=2.5;
  ctx.beginPath();
  data.forEach((d,i)=>{ const X=px(d.x), Y=py(d.y); i?ctx.lineTo(X,Y):ctx.moveTo(X,Y); });
  ctx.stroke();
  ctx.fillStyle='#2563eb';
  data.forEach(d=>{ ctx.beginPath(); ctx.arc(px(d.x), py(d.y), 3.5, 0, 7); ctx.fill(); });
  ctx.fillStyle='#94a3b8'; ctx.font='10px sans-serif'; ctx.textAlign='center';
  data.forEach((d,i)=>{ if(i===0 || i===data.length-1) ctx.fillText(fmtShort(d.x), px(d.x), h-10); });
  ctx.textAlign='left';
}
function forecastHealing(latest, ass, wound){
  const area = latest.areaCm2;
  if(!area || area <= 0) return {expectedDays:0,optimisticDays:0,pessimisticDays:0,ratePerWeek:0,confidence:'high',basedOnTrajectory:false};
  const w = ass.filter(a=>a.areaCm2);
  if(w.length >= 2){
    const f = w[0], l = w[w.length-1];
    const days = (l.createdAt - f.createdAt)/(24*60*60*1000);
    if(days >= 1 && f.areaCm2 > l.areaCm2){
      const r = (f.areaCm2 - l.areaCm2)/days;
      return {expectedDays: clamp(Math.round(area/r),3,365), optimisticDays: clamp(Math.round(area/(r*1.35)),3,365),
        pessimisticDays: clamp(Math.round(area/(r*0.6)),3,365), ratePerWeek: r*7, confidence:'high', basedOnTrajectory:true};
    }
  }
  const BASE = {diabetic_foot:0.55,pressure_ulcer:0.65,venous_ulcer:0.85,arterial_ulcer:0.70,surgical:1.20,burn:0.90,rash:1.80,other:0.80};
  let rate = BASE[wound?.type || 'other'] || 0.8;
  const t = latest.tissue || {};
  rate *= (0.7 + (t.granulation||0)/100 * 0.6);
  rate *= (1 - (t.necrosis||0)/100 * 0.6);
  rate *= (1 - (t.slough||0)/100 * 0.25);
  rate *= (1 + (t.epithelial||0)/100 * 0.4);
  const p = state.currentPatient || {};
  if(p.diabetes){ rate *= 0.7; if((p.hba1c||7) > 8) rate *= 0.8; }
  if(p.pvd) rate *= 0.65;
  if(p.smoker) rate *= 0.8;
  rate *= (1 - (latest.infection||0) * 0.55);
  const r = rate/7;
  return {expectedDays: clamp(Math.round(area/r),3,365), optimisticDays: clamp(Math.round(area/(r*1.4)),3,365),
    pessimisticDays: clamp(Math.round(area/(r*0.6)),3,365), ratePerWeek: rate, confidence:'medium', basedOnTrajectory:false};
}
function computeBiofilmScore(a){
  if(!a) return 0;
  const s = (a.tissue?.slough || 0)/100, g = (a.tissue?.granulation || 0)/100;
  const m = a.exudate === 'high' ? 1 : a.exudate === 'moderate' ? 0.6 : 0.3;
  const i = a.infection || 0;
  return +Math.min(1, (s*0.5) + (m*0.2) + (i*0.2) + ((1-g)*0.1)).toFixed(2);
}

async function generateHeatmapsFor(imgRec){
  try{
    const dataUrl = imgRec.dataUrl || (imgRec.blob ? await blobToBase64(imgRec.blob) : null);
    if(!dataUrl){ $('#hmBox').innerHTML = '<div class="muted">No image</div>'; return; }
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = dataUrl; });
    const MAX = 700;
    const scale = Math.min(1, MAX/Math.max(img.width, img.height));
    const W = Math.round(img.width*scale), H = Math.round(img.height*scale);
    const canvas = document.createElement('canvas'); canvas.width = W; canvas.height = H;
    const ctx = canvas.getContext('2d', {willReadFrequently:true});
    ctx.drawImage(img, 0, 0, W, H);
    const data = ctx.getImageData(0, 0, W, H).data;
    let mask;
    if(state.aiReady){
      try{
        const tensor = tf.browser.fromPixels(canvas).resizeBilinear([256,256]).toFloat().div(255).expandDims(0);
        const output = state.woundModel.predict(tensor);
        const maskData = await output.data();
        tf.dispose([tensor, output]);
        const raw = new Uint8Array(256*256);
        for(let i = 0; i < 256*256; i++) raw[i] = maskData[i] > 0.5 ? 1 : 0;
        const largest = largestComponent(raw, 256, 256);
        mask = new Uint8Array(W*H);
        for(let y = 0; y < H; y++) for(let x = 0; x < W; x++) mask[y*W+x] = largest[Math.floor(y*256/H)*256 + Math.floor(x*256/W)];
      } catch(e){ mask = segmentWoundFallback(data, W, H); }
    } else mask = segmentWoundFallback(data, W, H);

    const tissueCanvas = document.createElement('canvas'); tissueCanvas.width=W; tissueCanvas.height=H;
    const tctx = tissueCanvas.getContext('2d'); const timg = tctx.createImageData(W,H);
    const eryCanvas = document.createElement('canvas'); eryCanvas.width=W; eryCanvas.height=H;
    const ectx = eryCanvas.getContext('2d'); const eimg = ectx.createImageData(W,H);
    let redPx = 0, periPx = 0;
    for(let i = 0; i < W*H; i++){
      const r = data[i*4], g = data[i*4+1], b = data[i*4+2];
      if(mask[i]){
        const cls = classifyPixelColor(r,g,b);
        const c = {granulation:[225,29,72,140],slough:[234,179,8,140],necrosis:[31,41,55,160],epithelial:[249,168,212,140],other:[203,213,225,80]}[cls];
        timg.data[i*4]=c[0]; timg.data[i*4+1]=c[1]; timg.data[i*4+2]=c[2]; timg.data[i*4+3]=c[3];
      } else {
        const redness = r - (g+b)/2;
        if(redness > 20){ redPx++; eimg.data[i*4]=255; eimg.data[i*4+1]=60; eimg.data[i*4+2]=60; eimg.data[i*4+3]=Math.min(200, Math.round(redness*2.5)); }
        periPx++;
      }
    }
    tctx.putImageData(timg, 0, 0); ectx.putImageData(eimg, 0, 0);
    const tissueBlob = await new Promise(r=>tissueCanvas.toBlob(r,'image/png'));
    const eryBlob = await new Promise(r=>eryCanvas.toBlob(r,'image/png'));
    window._hmData = { tissue: URL.createObjectURL(tissueBlob), ery: URL.createObjectURL(eryBlob), orig: dataUrl, eryScore: periPx ? redPx/periPx : 0 };
    switchHmTab('tissue');
  }catch(e){ $('#hmBox').innerHTML = '<div class="muted">Heatmap failed: '+esc(e.message)+'</div>'; }
}
function switchHmTab(tab){
  ['tissue','ery','orig'].forEach(t=>{ const b = $('#hmTab-'+t); if(b) b.classList.toggle('on', t === tab); });
  if(!window._hmData) return;
  const legend = tab === 'tissue' ? `<div class="tlegend" style="margin-top:10px;justify-content:center">${tissueColors.map(t=>`<span><span class="tdot" style="background:${t.color}"></span>${t.label}</span>`).join('')}</div>` : tab === 'ery' ? `<div class="muted" style="font-size:11px;margin-top:10px">Erythema: ${(window._hmData.eryScore*100).toFixed(0)}% of periwound</div>` : '';

}

function calcPUSH(a){
  const area = a.areaCm2 || 0;
  let s = 0;
  if(area===0)s=0;else if(area<0.3)s=1;else if(area<=0.6)s=2;else if(area<=1.0)s=3;else if(area<=2.0)s=4;else if(area<=3.0)s=5;else if(area<=4.0)s=6;else if(area<=8.0)s=7;else if(area<=12.0)s=8;else if(area<=24.0)s=9;else s=10;
  let t = 2;
  const tissue = a.tissue || {};
  if((tissue.necrosis||0)>0)t=4;else if((tissue.slough||0)>0)t=3;else if((tissue.epithelial||0)>50)t=1;else if((tissue.granulation||0)>0)t=2;
  let e = 1;
  if(a.exudate==='moderate')e=2;else if(a.exudate==='high')e=3;
  return {area:s, exudate:e, tissue:t, total:s+e+t};
}
function calcBates(a){
  const area = a.areaCm2 || 0; const depth = a.depthCm || 0; const t = a.tissue || {};
  const size = area<1?1:area<4?2:area<10?3:area<20?4:5;
  const dep = depth<0.1?1:depth<0.3?2:depth<0.6?3:depth<1.0?4:5;
  const nt = (t.necrosis||0)>0?5:(t.slough||0)>0?3:1;
  const na = (t.necrosis||0)>50?5:(t.necrosis||0)>0?4:(t.slough||0)>50?3:(t.slough||0)>0?2:1;
  const gr = (t.granulation||0)>75?1:(t.granulation||0)>50?2:(t.granulation||0)>25?3:(t.granulation||0)>0?4:5;
  const ep = (t.epithelial||0)>75?1:(t.epithelial||0)>50?2:(t.epithelial||0)>25?3:(t.epithelial||0)>0?4:5;
  return {size, depth:dep, necroticType:nt, necroticAmount:na, granulation:gr, epithelialization:ep};
}
function calcWagner(a){
  const d = a.depthCm || 0;
  const inf = (a.infection || 0) > 0.5, nec = (a.tissue?.necrosis || 0) > 20;
  if(nec && inf) return {grade:'4', label:'Localized gangrene'};
  if(nec) return {grade:'5', label:'Extensive gangrene'};
  if(inf && d > 0.3) return {grade:'3', label:'Deep ulcer with abscess'};
  if(inf) return {grade:'2', label:'Deep ulcer with infection'};
  if(d > 0.3) return {grade:'1', label:'Deep ulcer to tendon/bone'};
  return {grade:'0', label:'No ulcer'};
}
function calcDESIGN(a){
  const t = a.tissue || {}; const d = a.depthCm || 0;
  const depth = d<0.1?0:d<0.3?1:d<0.6?2:3;
  const inf = (a.infection||0)>0.6?3:(a.infection||0)>0.3?2:(a.infection||0)>0.1?1:0;
  const sens = a.pain != null ? Math.min(3, Math.round(a.pain/3.3)) : 1;
  const tissue = (t.necrosis||0)>30?3:(t.slough||0)>50?2:(t.slough||0)>20?1:0;
  const edema = a.periwound==='edema'?2:1;
  const size = (a.areaCm2||0)>10?3:(a.areaCm2||0)>4?2:(a.areaCm2||0)>1?1:0;
  const total = depth+inf+sens+tissue+edema+size;
  return {total, severity: total<=6?'Low':total<=11?'Moderate':'High'};
}
function calcWBP(a){
  const t = a.tissue || {};
  let s = 0;
  s += (t.granulation||0)>50?3:(t.granulation||0)>20?2:1;
  s += (t.necrosis||0)<10?3:(t.necrosis||0)<30?2:1;
  s += (a.infection||0)<0.2?3:(a.infection||0)<0.5?2:1;
  s += (a.exudate==='low'||a.exudate==='none')?3:a.exudate==='moderate'?2:1;
  return {score:s, label: s>=10?'Ready for healing': s>=7?'Preparing':'Needs intervention'};
}
function calcTIMES(a){
  const t = a.tissue || {};
  let T = 'Granulating';
  if((t.necrosis||0)>20)T='Necrotic';else if((t.slough||0)>30)T='Sloughy';else if((t.epithelial||0)>30)T='Epithelializing';
  const I = (a.infection||0)>0.5?'Infected':(a.infection||0)>0.3?'Colonized':'Clean';
  const M = a.exudate==='high'?'High':a.exudate==='moderate'?'Moderate':a.exudate==='low'?'Low':'Balanced';
  const E = (t.granulation||0)>30?'Advancing':'Non-advancing';
  const S = a.periwound==='macerated'?'Macerated':a.periwound==='erythema'?'Erythema':'Healthy';
  return {T, I, M, E, S};
}

async function saveAndAnalyze(woundId, blob){
  const img = await loadImage(blob);

  const imageRec = {id: uid(), woundId, dataUrl: state.native ? dataUrl : null,

/* AI pipeline (unchanged from v7) */
async function analyzeWound(img, patient, markerMm, onStep){
  const step = (msg,pct) => onStep && onStep({msg,pct});
  const MAX = 1024;
  const scale = Math.min(1, MAX/Math.max(img.width, img.height));
  const W = Math.round(img.width*scale), H = Math.round(img.height*scale);
  const canvas = document.createElement('canvas'); canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d', {willReadFrequently:true});
  ctx.drawImage(img, 0, 0, W, H);
  const data = ctx.getImageData(0, 0, W, H).data;
  step('Detecting marker…', 15);
  const marker = detectMarker(data, W, H);
  const calibrated = !!marker;
  const cmPerPx = marker ? (markerMm/10)/marker.sidePx : 15/W;
  step('Segmenting…', 35);
  let mask;
  if(state.aiReady){
    try{
      const tensor = tf.browser.fromPixels(canvas).resizeBilinear([256,256]).toFloat().div(255).expandDims(0);
      const output = state.woundModel.predict(tensor);
      const maskData = await output.data();
      tf.dispose([tensor, output]);
      const raw = new Uint8Array(256*256);
      for(let i = 0; i < 256*256; i++) raw[i] = maskData[i] > 0.5 ? 1 : 0;
      const largest = largestComponent(raw, 256, 256);
      mask = new Uint8Array(W*H);
      for(let y = 0; y < H; y++) for(let x = 0; x < W; x++) mask[y*W+x] = largest[Math.floor(y*256/H)*256 + Math.floor(x*256/W)];
    } catch(e){ mask = segmentWoundFallback(data, W, H); }
  } else mask = segmentWoundFallback(data, W, H);
  const maskPx = mask.reduce((a,b)=>a + (b ? 1 : 0), 0);
  if(maskPx < 50) throw new Error('No wound detected');
  let minX = W, minY = H, maxX = 0, maxY = 0;
  for(let y = 0; y < H; y++) for(let x = 0; x < W; x++){
    if(mask[y*W+x]){ if(x<minX)minX=x; if(x>maxX)maxX=x; if(y<minY)minY=y; if(y>maxY)maxY=y; }
  }
  const bboxW = maxX - minX + 1, bboxH = maxY - minY + 1;
  const areaCm2 = +(maskPx * cmPerPx * cmPerPx).toFixed(2);
  const lengthCm = +(bboxH * cmPerPx).toFixed(2);
  const widthCm = +(bboxW * cmPerPx).toFixed(2);
  let perimPx = 0;
  for(let y = 1; y < H-1; y++) for(let x = 1; x < W-1; x++){
    const i = y*W + x;
    if(mask[i] && (!mask[i-1] || !mask[i+1] || !mask[i-W] || !mask[i+W])) perimPx++;
  }
  const perimeterCm = +(perimPx * cmPerPx).toFixed(2);
  const circularity = perimeterCm > 0 ? (4 * Math.PI * areaCm2) / (perimeterCm * perimeterCm) : 0;
  const elongation = bboxW > 0 ? Math.max(bboxW, bboxH) / Math.min(bboxW, bboxH) : 1;
  const edgeIrregularity = maskPx < 4 ? 1 : Math.max(1, perimPx / (2 * Math.sqrt(Math.PI * maskPx)));
  step('Classifying tissue…', 70);
  const tissue = classifyTissueColor(data, W, H, mask);
  step('Infection…', 88);
  const infection = estimateInfection(data, W, H, mask, minX, minY, maxX, maxY, tissue);
  const healingIndex = computeHealingIndex({area:areaCm2, tissue, infection, patient});
  step('Done', 100);
  return {areaCm2, perimeterCm, lengthCm, widthCm, depthCm:null, volumeCm3:null, tissue, infection, healingIndex, calibrated,
    circularity:+circularity.toFixed(3), elongation:+elongation.toFixed(2), edgeIrregularity:+edgeIrregularity.toFixed(2)};
}
function segmentWoundFallback(data, W, H){
  const n = W*H;
  const L = new Float32Array(n);
  for(let i = 0; i < n; i++){ const r = data[i*4], g = data[i*4+1], b = data[i*4+2]; L[i] = 0.299*r + 0.587*g + 0.114*b; }
  const bg = boxBlur(L, W, H, 24);
  const mask = new Uint8Array(n);
  for(let i = 0; i < n; i++) if(bg[i] - L[i] > 12) mask[i] = 1;
  let m = morphClose(mask, W, H, 4); m = morphOpen(m, W, H, 3);
  return largestComponent(m, W, H);
}
function boxBlur(src, W, H, r){
  const tmp = new Float32Array(W*H), out = new Float32Array(W*H);
  for(let y = 0; y < H; y++){
    let s = 0, c = 0;
    for(let x = -r; x <= r; x++){ const xx = Math.max(0, Math.min(W-1, x)); s += src[y*W+xx]; c++; }
    for(let x = 0; x < W; x++){ tmp[y*W+x] = s/c; const xr = Math.min(W-1, x+r), xl = Math.max(0, x-r-1); s += src[y*W+xr] - src[y*W+xl]; }
  }
  for(let x = 0; x < W; x++){
    let s = 0, c = 0;
    for(let y = -r; y <= r; y++){ const yy = Math.max(0, Math.min(H-1, y)); s += tmp[yy*W+x]; c++; }
    for(let y = 0; y < H; y++){ out[y*W+x] = s/c; const yr = Math.min(H-1, y+r), yl = Math.max(0, y-r-1); s += tmp[yr*W+x] - tmp[yl*W+x]; }
  }
  return out;
}
function morphClose(m, W, H, r){ return erode(dilate(m, W, H, r), W, H, r); }
function morphOpen(m, W, H, r){ return dilate(erode(m, W, H, r), W, H, r); }
function dilate(mask, W, H, r){
  const tmp = new Uint8Array(W*H), out = new Uint8Array(W*H);
  for(let y = 0; y < H; y++) for(let x = 0; x < W; x++){
    let a = 0;
    for(let dx = -r; dx <= r; dx++){ const xx = x+dx; if(xx >= 0 && xx < W && mask[y*W+xx]){ a = 1; break; } }
    tmp[y*W+x] = a;
  }
  for(let x = 0; x < W; x++) for(let y = 0; y < H; y++){
    let a = 0;
    for(let dy = -r; dy <= r; dy++){ const yy = y+dy; if(yy >= 0 && yy < H && tmp[yy*W+x]){ a = 1; break; } }
    out[y*W+x] = a;
  }
  return out;
}
function erode(mask, W, H, r){
  const tmp = new Uint8Array(W*H), out = new Uint8Array(W*H);
  for(let y = 0; y < H; y++) for(let x = 0; x < W; x++){
    let a = 1;
    for(let dx = -r; dx <= r; dx++){ const xx = x+dx; if(xx < 0 || xx >= W || !mask[y*W+xx]){ a = 0; break; } }
    tmp[y*W+x] = a;
  }
  for(let x = 0; x < W; x++) for(let y = 0; y < H; y++){
    let a = 1;
    for(let dy = -r; dy <= r; dy++){ const yy = y+dy; if(yy < 0 || yy >= H || !tmp[yy*W+x]){ a = 0; break; } }
    out[y*W+x] = a;
  }
  return out;
}
function largestComponent(mask, W, H){
  const labels = new Int32Array(W*H);
  let cur = 0, best = 0, bestSize = 0;
  const stack = [];
  for(let i = 0; i < W*H; i++){
    if(mask[i] && !labels[i]){
      cur++;
      let size = 0;
      stack.length = 0; stack.push(i); labels[i] = cur;
      while(stack.length){
        const p = stack.pop(); size++;
        const x = p % W, y = (p / W) | 0;
        if(x > 0 && mask[p-1] && !labels[p-1]){ labels[p-1] = cur; stack.push(p-1); }
        if(x < W-1 && mask[p+1] && !labels[p+1]){ labels[p+1] = cur; stack.push(p+1); }
        if(y > 0 && mask[p-W] && !labels[p-W]){ labels[p-W] = cur; stack.push(p-W); }
        if(y < H-1 && mask[p+W] && !labels[p+W]){ labels[p+W] = cur; stack.push(p+W); }
      }
      if(size > bestSize){ bestSize = size; best = cur; }
    }
  }
  const out = new Uint8Array(W*H);
  for(let i = 0; i < W*H; i++) if(labels[i] === best) out[i] = 1;
  return out;
}
function detectMarker(data, W, H){
  const gray = new Uint8Array(W*H);
  for(let i = 0; i < W*H; i++) gray[i] = (data[i*4]*0.299 + data[i*4+1]*0.587 + data[i*4+2]*0.114) | 0;
  const integral = new Float64Array((W+1)*(H+1));
  for(let y = 0; y < H; y++){ let rs = 0; for(let x = 0; x < W; x++){ rs += gray[y*W+x]; integral[(y+1)*(W+1)+(x+1)] = integral[y*(W+1)+(x+1)] + rs; } }
  const rS = (x0,y0,x1,y1) => integral[(y1+1)*(W+1)+(x1+1)] - integral[y0*(W+1)+(x1+1)] - integral[(y1+1)*(W+1)+x0] + integral[y0*(W+1)+x0];
  const bin = new Uint8Array(W*H); const r = 12;
  for(let y = 0; y < H; y++) for(let x = 0; x < W; x++){
    const x0 = Math.max(0,x-r), y0 = Math.max(0,y-r), x1 = Math.min(W-1,x+r), y1 = Math.min(H-1,y+r);
    const area = (x1-x0+1)*(y1-y0+1);
    const mean = rS(x0,y0,x1,y1) / area;
    bin[y*W+x] = gray[y*W+x] < mean - 8 ? 1 : 0;
  }
  const labels = new Int32Array(W*H); const comps = []; let cur = 0; const stack = [];
  for(let i = 0; i < W*H; i++){
    if(bin[i] && !labels[i]){
      cur++; stack.length = 0; stack.push(i); labels[i] = cur;
      let minX = W, minY = H, maxX = 0, maxY = 0, count = 0;
      while(stack.length){
        const p = stack.pop(); count++;
        const x = p % W, y = (p / W) | 0;
        if(x<minX)minX=x; if(x>maxX)maxX=x; if(y<minY)minY=y; if(y>maxY)maxY=y;
        if(x>0&&bin[p-1]&&!labels[p-1]){labels[p-1]=cur;stack.push(p-1);}
        if(x<W-1&&bin[p+1]&&!labels[p+1]){labels[p+1]=cur;stack.push(p+1);}
        if(y>0&&bin[p-W]&&!labels[p-W]){labels[p-W]=cur;stack.push(p-W);}
        if(y<H-1&&bin[p+W]&&!labels[p+W]){labels[p+W]=cur;stack.push(p+W);}
      }
      comps.push({cur, count, minX, minY, maxX, maxY});
    }
  }
  let best = null, bestScore = 0;
  for(const c of comps){
    const w = c.maxX - c.minX + 1, h = c.maxY - c.minY + 1;
    if(w < 30 || h < 30) continue;
    if(w > W*0.6 || h > H*0.6) continue;
    const a = w/h; if(a < 0.75 || a > 1.35) continue;
    const f = c.count/(w*h); if(f < 0.55 || f > 0.98) continue;
    const s = Math.min(w,h)*f;
    if(s > bestScore){ bestScore = s; best = {sidePx:(w+h)/2, bbox:c}; }
  }
  return best;
}
function classifyTissueColor(data, W, H, mask){
  const counts = {granulation:0, slough:0, necrosis:0, epithelial:0, other:0};
  let total = 0;
  for(let i = 0; i < W*H; i++){
    if(!mask[i]) continue;
    const r = data[i*4], g = data[i*4+1], b = data[i*4+2];
    counts[classifyPixelColor(r,g,b)]++; total++;
  }
  const tissue = {};
  for(const k in counts) tissue[k] = +((counts[k]/(total||1))*100).toFixed(1);
  return tissue;
}
function classifyPixelColor(r,g,b){
  const l = 0.299*r + 0.587*g + 0.114*b;
  if(l < 55) return 'necrosis';
  if(r > 140 && g > 120 && b < 130 && Math.abs(r-g) < 50) return 'slough';
  if(r > 140 && g < r*0.75 && b < r*0.75) return 'granulation';
  if(r > 170 && g > 120 && b > 120) return 'epithelial';
  return 'other';
}
function estimateInfection(data, W, H, mask, minX, minY, maxX, maxY, tissue){
  const pad = Math.max(12, Math.round((maxX-minX)*0.35));
  const x0 = Math.max(0, minX-pad), x1 = Math.min(W-1, maxX+pad);
  const y0 = Math.max(0, minY-pad), y1 = Math.min(H-1, maxY+pad);
  let red = 0, skin = 0;
  for(let y = y0; y <= y1; y++) for(let x = x0; x <= x1; x++){
    const i = y*W+x;
    if(mask[i]) continue;
    skin++;
    const r = data[i*4], g = data[i*4+1], b = data[i*4+2];
    if(r > 150 && r-g > 35 && r-b > 35) red++;
  }
  const erythema = skin ? red/skin : 0;
  const sl = (tissue.slough||0)/100, gr = (tissue.granulation||0)/100;
  const sig = Math.max(0, sl - gr*0.6);
  return +Math.min(1, erythema*0.8 + sig*0.4).toFixed(3);
}
function computeHealingIndex({area, tissue, infection, patient}){
  let risk = 0;
  if(area > 4) risk += 0.3; else if(area > 2) risk += 0.15;
  if((tissue.necrosis||0) > 20) risk += 0.3; else if((tissue.slough||0) > 40) risk += 0.15;
  if(infection > 0.6) risk += 0.3; else if(infection > 0.3) risk += 0.1;
  if(patient?.diabetes) risk += 0.1;
  if(patient?.pvd) risk += 0.15;
  if(patient?.smoker) risk += 0.05;
  return Math.min(1, +risk.toFixed(2));
}

function downloadBlob(blob, filename){
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = filename; document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 2000);
}

async function exportWoundPDF(woundId){
  const w = await DB.get('wounds', woundId);
  const p = await DB.get('patients', w.patientId);
  const imgs = (await DB.all('images','woundId',woundId)).sort((a,b)=>a.createdAt-b.createdAt);
  const ass = (await DB.all('assessments','woundId',woundId)).sort((a,b)=>a.createdAt-b.createdAt);
  if(!ass.length){ toast('No assessments'); return; }
  toast('Generating PDF…', 4000);
  const {jsPDF} = window.jspdf;
  const doc = new jsPDF({unit:'mm', format:'a4'});
  const PW = 210, PH = 297, M = 18;
  doc.setFillColor(37,99,235); doc.rect(0, 0, PW, 32, 'F');
  doc.setFillColor(6,182,212); doc.rect(0, 26, PW, 6, 'F');
  doc.setTextColor(255,255,255); doc.setFont('helvetica','bold'); doc.setFontSize(22);
  doc.text('YULTO CARE', M, 15);
  doc.setFont('helvetica','normal'); doc.setFontSize(9);
  doc.text('Clinical Wound Assessment', PW-M, 15, {align:'right'});
  doc.text('Generated: '+new Date().toLocaleString(), PW-M, 21, {align:'right'});
  let y = 44;
  doc.setFillColor(241,245,249); doc.rect(M, y-4, PW-M*2, 30, 'F');
  doc.setTextColor(15,23,42); doc.setFont('helvetica','bold'); doc.setFontSize(12);
  doc.text(p?.name || 'Unknown patient', M+4, y+4);
  doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.setTextColor(71,85,105);
  doc.text('MRN: '+(p?.mrn || '—'), M+4, y+11);
  doc.text('DOB: '+(p?.dob || '—'), M+4, y+16);
  doc.text('Sex: '+(p?.sex || '—'), M+80, y+11);
  const cm = []; if(p?.diabetes) cm.push('DM'); if(p?.pvd) cm.push('PVD'); if(p?.smoker) cm.push('Smoker');
  doc.text('Comorbidities: '+(cm.length?cm.join(', '):'None'), M+80, y+16);
  y += 36;
  doc.setFillColor(219,234,254); doc.rect(M, y-4, PW-M*2, 18, 'F');
  doc.setTextColor(30,64,175); doc.setFont('helvetica','bold'); doc.setFontSize(11);
  doc.text('Wound: '+(w.label || '—'), M+4, y+3);
  doc.setFont('helvetica','normal'); doc.setFontSize(9);
  doc.text('Type: '+(w.type||'—').replace(/_/g,' ')+' · Location: '+(w.location||'—')+' · Status: '+(w.status||'—'), M+4, y+10);
  y += 24;
  const latest = ass[ass.length-1];
  doc.setFont('helvetica','bold'); doc.setFontSize(13); doc.setTextColor(37,99,235);
  doc.text('Latest Assessment', M, y); y += 3;
  doc.setDrawColor(37,99,235); doc.setLineWidth(0.6); doc.line(M, y, M+40, y);
  y += 8;
  doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.setTextColor(71,85,105);
  doc.text('Date: '+fmtDate(latest.createdAt), M, y); y += 8;
  const rows = [['Area', latest.areaCm2 ? latest.areaCm2+' cm²' : '—'],['Perimeter', latest.perimeterCm ? latest.perimeterCm+' cm' : '—'],['Circularity', latest.circularity ? (latest.circularity*100).toFixed(0)+'%' : '—'],['Infection risk', (latest.infection*100).toFixed(0)+'%'],['Expected healing', latest.expectedDays ? latest.expectedDays+' days' : '—'],['Pain', latest.pain != null ? latest.pain+'/10' : '—'],['Exudate', latest.exudate || '—'],['Dressing', latest.dressings || '—']];
  const colW = (PW - M*2) / 2;
  rows.forEach((r, i) => {
    const col = i % 2, row = Math.floor(i / 2);
    const rx = M + col * colW, ry = y + row * 7;
    doc.setTextColor(100,116,139); doc.setFont('helvetica','normal');
    doc.text(r[0]+':', rx, ry);
    doc.setTextColor(15,23,42); doc.setFont('helvetica','bold');
    doc.text(String(r[1]), rx + 34, ry);
  });
  y += Math.ceil(rows.length / 2) * 7 + 6;
  if(latest.tissue){
    doc.setFont('helvetica','bold'); doc.setFontSize(11); doc.setTextColor(37,99,235);
    doc.text('Tissue Composition', M, y); y += 6;
    doc.setFont('helvetica','normal'); doc.setFontSize(9);
    Object.entries(latest.tissue).filter(([k,v])=>v > 0).forEach(([k,v]) => {
      doc.setTextColor(100,116,139); doc.text('• '+k.charAt(0).toUpperCase()+k.slice(1)+':', M+2, y);
      doc.setTextColor(15,23,42); doc.setFont('helvetica','bold'); doc.text(v+'%', M+50, y);
      doc.setFont('helvetica','normal'); y += 5;
    });
    y += 4;
  }
  if(imgs.length){
    if(y > PH - 90){ doc.addPage(); y = M; }
    doc.setFont('helvetica','bold'); doc.setFontSize(11); doc.setTextColor(37,99,235);
    doc.text('Photo History', M, y); y += 6;
    const tw = 54, th = 54, gap = 6;
    let col = 0;
    for(const img of imgs.slice(-6)){
      if(y + th + 8 > PH - M){ doc.addPage(); y = M; col = 0; }
      const dataUrl = img.dataUrl || (img.blob ? await blobToDataURL(img.blob) : null);
      if(!dataUrl) continue;
      const x = M + col * (tw + gap);
      try{
        doc.setDrawColor(226,232,240); doc.setLineWidth(0.3); doc.rect(x, y, tw, th);
        doc.addImage(dataUrl, 'JPEG', x+0.5, y+0.5, tw-1, th-1);
      }catch(e){}
      doc.setFontSize(7); doc.setTextColor(100,116,139);
      doc.text(fmtDate(img.createdAt), x, y+th+4);
      col++;
      if(col >= 3){ col = 0; y += th + 10; }
    }
    y += th + 10;
  }
  const totalPages = doc.getNumberOfPages();
  for(let i = 1; i <= totalPages; i++){
    doc.setPage(i);
    doc.setDrawColor(226,232,240); doc.setLineWidth(0.3); doc.line(M, PH-14, PW-M, PH-14);
    doc.setFontSize(7); doc.setTextColor(148,163,184);
    doc.text('YULTO CARE · Clinical wound platform', M, PH-9);
    doc.text('Page '+i+' of '+totalPages, PW-M, PH-9, {align:'right'});
  }
  const filename = 'yulto-'+((p?.name||'patient').replace(/[^a-z0-9]/gi,'_'))+'-'+fmtDate(latest.createdAt).replace(/[^a-z0-9]/gi,'-')+'.pdf';
  const pdfBlob = doc.output('blob');
  const base64 = await getBase64FromBlob(pdfBlob);
  if(state.native && window.yultoDB.saveAndShareBinary){
    try{ await window.yultoDB.saveAndShareBinary(base64.split(',')[1], filename, 'application/pdf'); toast('PDF saved to Documents/YULTO_CARE'); return; }catch(e){ console.warn('pdf native', e); }
  }
  downloadBlob(pdfBlob, filename);
  toast('PDF saved');
}
function blobToDataURL(blob){ return new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(blob); }); }

      <div class="pie-legend">${labels.map((t,i)=>`<span><span class="tdot" style="background:${colors[i%colors.length]}"></span>${t.replace(/_/g,' ')} (${byType[t]})</span>`).join('')}</div>
    </div>` : ''}`;

function drawPie(values, colors){
  const c = $('#pieChart'); if(!c) return;
  const dpr = window.devicePixelRatio || 1;
  const w = c.clientWidth, h = 180;
  c.width = w*dpr; c.height = h*dpr;
  const ctx = c.getContext('2d'); ctx.scale(dpr,dpr);
  const total = values.reduce((a,b)=>a+b,0);
  if(!total) return;
  const cx = w/2, cy = h/2, r = Math.min(w,h)*0.4;
  let a = -Math.PI/2;
  values.forEach((val,i)=>{
    const s = (val/total) * Math.PI * 2;
    ctx.beginPath(); ctx.moveTo(cx,cy); ctx.arc(cx, cy, r, a, a+s); ctx.closePath();
    ctx.fillStyle = colors[i%colors.length]; ctx.fill();
    a += s;
  });
  ctx.beginPath(); ctx.arc(cx, cy, r*0.5, 0, Math.PI*2); ctx.fillStyle = '#fff'; ctx.fill();
  ctx.fillStyle = '#0f172a'; ctx.font = 'bold 20px system-ui'; ctx.textAlign = 'center';
  ctx.fillText(String(total), cx, cy+7);
}

async function restoreFromFile(input){
  const f = input.files[0]; if(!f) return;
  if(!confirm('Restoring will REPLACE all current data. Continue?')) return;
  try{
    const text = await f.text();
    if(state.native){ await window.yultoDB.importFromFileJson(text); }
    else {
      const data = JSON.parse(text);
      await DB.clearAll();
      for(const p of data.patients||[]) await DB.put('patients', p);
      for(const w of data.wounds||[]) await DB.put('wounds', w);
      for(const a of data.assessments||[]) await DB.put('assessments', a);
      for(const i of data.images||[]){ i.blob = base64ToBlob(i.blob); await DB.put('images', i); }
    }
    toast('Restore successful'); go('home');
  }catch(e){ toast('Restore failed: '+e.message, 3500); }
}
async function wipeAll(){
  if(!confirm('Delete ALL data permanently?')) return;
  if(!confirm('Really? This cannot be undone. Did you back up first?')) return;
  await DB.clearAll();
  await DB.put('settings',{k:'last_backup_ts', v:0});
  state.lastBackupAt = 0;
  toast('All data deleted'); go('home');
}

  DB.get('images', id).then(img => {
    if(!img) return;
    openModal(`<img src="${imgSrc(img)}" style="width:100%;border-radius:12px"><p class="muted" style="text-align:center;margin-top:8px">${fmtDate(img.createdAt)}</p>`);
  });
}
async function openPatient(id){ state.currentPatient = await DB.get('patients', id); go('patient'); }
async function openWound(id){ state.currentWound = await DB.get('wounds', id); go('wound'); }

/* Boot */
(async function boot(){
  setTimeout(()=>$('#splash').classList.add('hide'), 2400);
  setTimeout(()=>$('#login').classList.remove('hidden'), 1100);

  const readyStart = Date.now();
  while(!window.YULTO_READY && Date.now() - readyStart < 5000){
    await new Promise(r => setTimeout(r, 50));
  }
  if(window.YULTO_READY && window.yultoDB){
    state.native = true;
    try{ await window.yultoDB.openDB(); }catch(e){ state.native = false; }
  }
  if(!state.native){ try{ await openBrowserDB(); }catch(e){} }
  try{
    const pinRec = await DB.get('settings','pin');
    if(!pinRec) await DB.put('settings',{k:'pin', v:'0000'});
    const lb = await DB.get('settings','last_backup_ts');
    state.lastBackupAt = lb?.v || 0;
    const fa = await DB.get('settings','failed_attempts');
    state.failedAttempts = fa?.v || 0;
    const cl = await DB.get('settings','clinician');
    state._clinicianName = cl?.v || '';
  }catch(e){}
  let inSession = false;
  try{ inSession = !!sessionStorage.getItem('yulto-in'); }catch(e){}
  if(inSession){
    $('#login').classList.add('hidden');
    $('#app').classList.remove('hidden');
    go('home');
    maybeAutoBackup();
  }
  loadAI().catch(e => console.warn('AI load failed', e));
})();
</script>
</body>
</html>
